 everything, just read the short thought below each verse.",extraVerses:[{refAF:"Matteus 24:10-12",refEN:"Matthew 24:10-12",textAF:"Baie sal struikel en mekaar verraai en mekaar haat — liefde verkoel omdat wettelose optrede toeneem.",textEN:"Many will be offended, will betray and hate one another — love grows cold as lawlessness increases."},{refAF:"Lukas 17:1",refEN:"Luke 17:1",textAF:"Dit is onvermydelik dat daar dinge kom wat mense laat struikel, maar wee hom deur wie dit kom.",textEN:"It is impossible that no offences should come, but woe to him through whom they do come."},{refAF:"Prediker 7:21-22",refEN:"Ecclesiastes 7:21-22",textAF:"Moenie luister na alles wat mense sê nie — jy weet self jy het ook al so gepraat oor ander.",textEN:"Do not take to heart all people say — you know in your heart you have also spoken badly about others."}],applicationAF:"Vandag: As jy aanstoot voel, vra: Is dit 'n haak? Skryf die naam neer en bid: Here, ek kies om nie hierdie haak te sluk nie.",applicationEN:"Today: When you feel offended, ask: Is this a hook? Write down the name and pray: Lord, I choose not to swallow this hook.",prayerAF:"Here, wys my waar ek vashou aan aanstoot. Ek wil nie in 'n strik leef nie. Help my om los te laat.",prayerEN:"Lord, show me where I'm holding onto offence. I don't want to live in a trap. Help me let go.",questionsAF:["Waar het jy laaste 'n haak gevoel?","Wat gebeur in jou lyf en gedagtes as jy aanstoot neem?","Wie moet jy vergewe — nie vir hulle nie, maar vir jou vryheid?"],questionsEN:["Where did you last feel a hook?","What happens in your body and thoughts when you take offence?","Who do you need to forgive — not for them, but for your freedom?"]},{id:2,titleAF:"Week 2 — Jesus Neem Nie Aanstoot Nie",titleEN:"Week 2 — Jesus Didn't Take Offence",keyVerse:{refAF:"1 Petrus 2:23",refEN:"1 Peter 2:23",textAF:"Toe Hy uitgeskel is, het Hy nie teruggeskel nie; toe Hy gely het, het Hy nie gedreig nie, maar dit oorgelaat aan Hom wat regverdig oordeel.",textEN:"When they hurled their insults at him, he did not retaliate; when he suffered, he made no threats. Instead, he entrusted himself to him who judges justly."},storyAF:"Mense het Jesus uitgelag, vals beskuldig, uiteindelik gekruisig. Hy het elke rede gehad om aanstoot te neem. Maar Hy het nie. Hy het nie sy hart toegegaan nie. Hy het oop gebly — selfs aan die kruis: 'Vader, vergewe hulle.'",storyEN:"People mocked Jesus, falsely accused him, finally crucified him. He had every reason to take offence. But he didn't. He didn't close his heart. He stayed open — even on the cross: 'Father, forgive them.'",meaningAF:"Jesus wys: Jy kan seergemaak word sonder om aanstoot te neem. Seer is 'n wond; aanstoot is hoe jy die wond hanteer. Hy het die seer na die Vader geneem, nie na bitterheid toe nie.",meaningEN:"Jesus shows: You can be hurt without taking offence. Hurt is a wound; offence is how you handle the wound. He took the hurt to the Father, not to bitterness.",extraAF:"Kort gedagtes vir as jy min tyd het:",extraEN:"Short thoughts if you're short on time:",extraVerses:[{refAF:"Jesaja 53:7",refEN:"Isaiah 53:7",textAF:"Hy is verdruk en Hy het Hom laat mishandel, maar sy mond het Hy nie oopgemaak nie.",textEN:"He was oppressed and afflicted, yet he did not open his mouth."},{refAF:"Lukas 23:34",refEN:"Luke 23:34",textAF:"Jesus sê: Vader, vergeef hulle, want hulle weet nie wat hulle doen nie.",textEN:"Jesus said: Father, forgive them, for they do not know what they are doing."},{refAF:"Hebreërs 12:2-3",refEN:"Hebrews 12:2-3",textAF:"Kyk na Jesus wat die kruis verdra het ten spyte van skande — sodat julle nie moeg word nie.",textEN:"Consider Jesus who endured the cross, scorning its shame — so you will not grow weary."}],applicationAF:"As iemand jou vandag seermaak, doen wat Jesus gedoen het: Moenie dadelik terugpraat nie. Gaan eers na die Vader. Sê hardop: Ek vertrou U om reg te oordeel.",applicationEN:"When someone hurts you today, do what Jesus did: Don't reply immediately. Go to the Father first. Say out loud: I trust You to judge justly.",prayerAF:"Jesus, leer my om oop te bly soos U. Ek wil nie toemaak nie. Ek kies U manier.",prayerEN:"Jesus, teach me to stay open like You. I don't want to close up. I choose Your way.",questionsAF:["Wat is die verskil tussen seer kry en aanstoot neem vir jou?","Wanneer laas het jy teruggeskel of gedreig in jou hart?","Hoe lyk dit om jou saak aan God oor te laat?"],questionsEN:["What is the difference for you between being hurt and taking offence?","When last did you retaliate or threaten in your heart?","What does it look like to entrust your case to God?"]},{id:3,titleAF:"Week 3 — 'n Hart Wat Nie Struikel Nie",titleEN:"Week 3 — A Heart That Doesn't Stumble",keyVerse:{refAF:"Psalm 119:165",refEN:"Psalm 119:165",textAF:"Die wat U wet liefhet, het groot vrede; vir hulle is daar geen struikelblok nie.",textEN:"Great peace have those who love your law, and nothing can make them stumble."},storyAF:"Twee mense hoor dieselfde grap. Een lag, een is diep seergemaak. Hoekom? Nie oor die grap nie, maar oor die hart. 'n Hart vol van God se Woord het vrede wat groter is as die struikelblok.",storyEN:"Two people hear the same joke. One laughs, one is deeply hurt. Why? Not because of the joke, but because of the heart. A heart full of God's Word has peace that's bigger than the stumbling block.",meaningAF:"God belowe nie 'n lewe sonder struikelblokke nie, maar 'n hart waar struikelblokke nie jou vrede steel nie. Liefde vir sy Woord bou 'n sagte, sterk hart — jy hoef nie elke ding te verdedig nie.",meaningEN:"God doesn't promise a life without stumbling blocks, but a heart where stumbling blocks don't steal your peace. Love for His Word builds a soft, strong heart — you don't have to defend everything.",extraAF:"Kort uittreksels:",extraEN:"Short excerpts:",extraVerses:[{refAF:"Spreuke 19:11",refEN:"Proverbs 19:11",textAF:"Deur verstandelik te wees hou iemand sy toorn terug; dit is sy eer om 'n oortreding te vergewe.",textEN:"A person's wisdom yields patience; it is to one's glory to overlook an offence."},{refAF:"Jakobus 1:19",refEN:"James 1:19",textAF:"Wees gou om te luister, stadig om te praat, stadig om kwaad te word.",textEN:"Be quick to listen, slow to speak and slow to become angry."},{refAF:"Filippense 4:7",refEN:"Philippians 4:7",textAF:"God se vrede wat alle verstand te bowe gaan, sal julle harte bewaar.",textEN:"The peace of God that passes all understanding will guard your hearts."}],applicationAF:"Lees een Psalm hardop elke oggend hierdie week. Laat vrede eerste inkom, voor mense se woorde.",applicationEN:"Read one Psalm out loud every morning this week. Let peace come in first, before people's words.",prayerAF:"Here, ek wil U Woord liefhê meer as my reg om seer te wees. Gee my groot vrede.",prayerEN:"Lord, I want to love Your Word more than my right to be hurt. Give me great peace.",questionsAF:["Wat steel maklik jou vrede?","Hoe kan jy vinniger luister en stadiger kwaad word hierdie week?","Watter vers kan jy memoriseer vir wanneer jy wil struikel?"],questionsEN:["What steals your peace easily?","How can you listen faster and get angry slower this week?","What verse can you memorize for when you want to stumble?"]},{id:4,titleAF:"Week 4 — Vergewe en Laat Los",titleEN:"Week 4 — Forgive and Release",keyVerse:{refAF:"Efesiërs 4:31-32",refEN:"Ephesians 4:31-32",textAF:"Laat alle bitterheid en woede en toorn en geskreeu en gevloek van julle weggeneem word. Wees vriendelik en barmhartig en vergewe mekaar soos God julle in Christus vergewe het.",textEN:"Get rid of all bitterness, rage and anger, brawling and slander. Be kind and compassionate to one another, forgiving each other, just as in Christ God forgave you."},storyAF:"Thandi dra 'n rugsak. Elke keer as iemand haar seermaak, sit sy 'n klip in. Na jare is die sak swaar. Sy kan nie hardloop nie. Vergewe is nie sê dis okay nie — dis om die sak neer te sit. Jy vergewe nie omdat hulle dit verdien nie, maar omdat jy nie die gewig wil dra nie.",storyEN:"Thandi carries a backpack. Every time someone hurts her, she puts a stone in. After years the bag is heavy. She can't run. Forgiving is not saying it's okay — it's putting the bag down. You don't forgive because they deserve it, but because you don't want to carry the weight.",meaningAF:"Aanstoot hou jou in die verlede vas. Vergifnis maak jou vry vir die toekoms. God het jou vergewe toe jy dit nie verdien het nie — nou kan jy dieselfde asem gee aan ander. Vergifnis is 'n besluit, dan 'n proses.",meaningEN:"Offence keeps you stuck in the past. Forgiveness frees you for the future. God forgave you when you didn't deserve it — now you can give that same breath to others. Forgiveness is a decision, then a process.",extraAF:"As jy min tyd het, hierdie is die kern:",extraEN:"If you're short on time, this is the core:",extraVerses:[{refAF:"Matteus 18:21-22",refEN:"Matthew 18:21-22",textAF:"Nie tot sewe maal nie, maar tot sewentig maal sewe keer moet jy vergewe.",textEN:"Not seven times, but seventy times seven you must forgive."},{refAF:"Kolosser 3:13",refEN:"Colossians 3:13",textAF:"Verdra mekaar en vergewe mekaar; soos Christus julle vergewe het, so moet julle ook doen.",textEN:"Bear with each other and forgive one another; as Christ forgave you, so you also must forgive."},{refAF:"Markus 11:25",refEN:"Mark 11:25",textAF:"Wanneer julle staan en bid, vergewe as julle iets teen iemand het.",textEN:"When you stand praying, if you hold anything against anyone, forgive them."}],applicationAF:"Skryf vandag op 'n papier: Ek kies om [naam] te vergewe vir [wat gebeur het]. Ek laat los. Skeur dit dan of brand dit veilig — 'n teken jy dra nie meer nie.",applicationEN:"Write on paper today: I choose to forgive [name] for [what happened]. I release it. Then tear it or safely burn it — a sign you no longer carry it.",prayerAF:"Vader, ek vergewe soos U my vergewe het. Dit voel swaar, maar ek kies vryheid. Genees my hart.",prayerEN:"Father, I forgive as You forgave me. It feels heavy, but I choose freedom. Heal my heart.",questionsAF:["Watter klip dra jy die langste?","Wat dink jy beteken vergewe — en wat beteken dit nie?","Hoe kan jy hierdie week een tree van loslaat neem?"],questionsEN:["Which stone have you carried the longest?","What do you think forgiveness means — and what does it not mean?","How can you take one step of release this week?"]},{id:5,titleAF:"Week 5 — Gee Geen Aanstoot Nie",titleEN:"Week 5 — Give No Offence",keyVerse:{refAF:"Handelinge 15:39",refEN:"Acts 15:39",textAF:"Toe ontstaan daar 'n hewige onenigheid, sodat hulle van mekaar geskei het. Barnabas het Markus saamgeneem en na Ciprus gevaar.",textEN:"They had such a sharp disagreement that they parted company. Barnabas took Mark and sailed for Cyprus."},storyAF:"Paulus en Barnabas — beste vriende, bedien saam, sien wonderwerke. Dan stry hulle oor Johannes Markus. Markus het vroeër weggeloop. Paulus sê: nie weer nie. Barnabas sê: kom ons gee hom 'n tweede kans. Hulle stem nie saam nie. Hulle skei. Dit is rou en eerlik. Selfs geestelike mense kan aanstoot gee en kry. Maar God gebruik steeds albei paaie — Paulus vat Silas, Barnabas herstel Markus, wat later die Evangelie skryf wat Paulus self nodig het in 2 Timoteus 4:11.",storyEN:"Paul and Barnabas — best friends, minister together, see miracles. Then they argue about John Mark. Mark had deserted earlier. Paul says: not again. Barnabas says: let's give him a second chance. They don't agree. They separate. It's raw and honest. Even spiritual people can give and take offence. But God still uses both roads — Paul takes Silas, Barnabas restores Mark, who later writes the Gospel that Paul himself needs in 2 Timothy 4:11.",meaningAF:"Hierdie storie is nie oor wie reg was nie, maar oor hoe om nie in aanstoot te bly nie. Hulle het nie mekaar sleg gemaak nie. Hulle het nie bitter geword nie. Hulle het aangehou met die sending. Soms is skeiding nie sonde nie, maar aanstoot wat bly is. Jy kan verskil sonder om te verag.",meaningEN:"This story is not about who was right, but about how not to stay in offence. They didn't trash each other. They didn't become bitter. They kept on mission. Sometimes separation is not sin, but staying offended is. You can disagree without despising.",extraAF:"Kort opsommings as jy nie tyd het vir alles nie:",extraEN:"Short summaries if you don't have time for all:",extraVerses:[{refAF:"Handelinge 15:36-41",refEN:"Acts 15:36-41",textAF:"Paulus en Barnabas beplan 'n tweede reis, verskil oor Markus, en skei — God werk steeds deur albei spanne.",textEN:"Paul and Barnabas plan a second journey, disagree about Mark, and part ways — God still works through both teams."},{refAF:"2 Timoteus 4:11",refEN:"2 Timothy 4:11",textAF:"Net Lukas is by my. Haal Markus en bring hom, want hy is vir my nuttig in die bediening.",textEN:"Only Luke is with me. Get Mark and bring him, because he is helpful to me in my ministry."},{refAF:"Romeine 12:18",refEN:"Romans 12:18",textAF:"As dit moontlik is, hou vrede met alle mense sover dit van julle afhang.",textEN:"If it is possible, as far as it depends on you, live at peace with everyone."},{refAF:"1 Korintiërs 10:32-33",refEN:"1 Corinthians 10:32-33",textAF:"Moenie 'n struikelblok wees nie — soos ek probeer om almal tevrede te stel, nie vir myself nie.",textEN:"Do not cause anyone to stumble — as I try to please everyone, not seeking my own good."}],applicationAF:"Dink aan iemand met wie jy verskil. Jy hoef nie saam te stem om vrede te hou nie. Stuur 'n boodskap: Ek waardeer jou, al verskil ons. Ek kies geen aanstoot nie.",applicationEN:"Think of someone you disagree with. You don't have to agree to keep peace. Send a message: I value you, even though we disagree. I choose no offence.",prayerAF:"Here, ek wil nie 'n struikelblok wees nie. Help my om te verskil sonder om te breek. Gebruik my pad, selfs as dit anders is as ander s'n.",prayerEN:"Lord, I don't want to be a stumbling block. Help me to differ without breaking. Use my road, even if it's different from others'.",questionsAF:["Het jy al 'n vriendskap verloor oor 'n verskil soos Paulus en Barnabas?","Hoe kan jy verskil sonder om aanstoot te gee of te neem?","Wie is jou 'Markus' — iemand wat 'n tweede kans nodig het?"],questionsEN:["Have you lost a friendship over a difference like Paul and Barnabas?","How can you disagree without giving or taking offence?","Who is your 'Mark' — someone who needs a second chance?"]},{id:6,titleAF:"Week 6 — Leef Vry",titleEN:"Week 6 — Live Free",keyVerse:{refAF:"Romeine 14:13",refEN:"Romans 14:13",textAF:"Laat ons mekaar dan nie meer oordeel nie, maar stel liewer dit vas: om nie 'n struikelblok of aanstoot voor jou broer te lê nie.",textEN:"Therefore let us stop passing judgment on one another. Instead, make up your mind not to put any stumbling block or obstacle in the way of a brother or sister."},storyAF:"Jy stap by 'n huis in. Daar lê speelgoed oral. Jy kan struikel, of jy kan help optel. Baie mense leef so dat ander oor hulle struikel — met woorde, posts, grappies. Vry mense leef anders: Hulle maak die pad skoon. Hulle vra: Help my lewe iemand anders om Jesus te sien, of struikel hulle oor my?",storyEN:"You walk into a house. Toys are everywhere. You can stumble, or you can help pick them up. Many people live so that others stumble over them — with words, posts, jokes. Free people live differently: They clear the road. They ask: Does my life help someone else see Jesus, or do they stumble over me?",meaningAF:"Vryheid is nie om te sê wat jy wil nie, maar om so te leef dat ander vry word. Om geen aanstoot te gee nie beteken nie jy is vals nie — dit beteken jy is liefdevol. Jy kies woorde wat bou, nie breek nie. Jy kies om nie te oordeel nie, maar om die pad oop te maak.",meaningEN:"Freedom is not saying whatever you want, but living so that others become free. To give no offence doesn't mean you're fake — it means you're loving. You choose words that build, not break. You choose not to judge, but to clear the road.",extraAF:"Laaste kort uittreksels:",extraEN:"Final short excerpts:",extraVerses:[{refAF:"Johannes 8:36",refEN:"John 8:36",textAF:"As die Seun julle vry maak, sal julle werklik vry wees.",textEN:"If the Son sets you free, you will be free indeed."},{refAF:"Galasiërs 5:13",refEN:"Galatians 5:13",textAF:"Julle is tot vryheid geroep; gebruik vryheid nie as 'n verskoning vir sonde nie, maar dien mekaar in liefde.",textEN:"You were called to freedom; don't use freedom to indulge the flesh, but serve one another in love."},{refAF:"1 Korintiërs 13:5",refEN:"1 Corinthians 13:5",textAF:"Liefde neem nie aanstoot nie, is nie selfsugtig nie, hou nie boek van die kwaad nie.",textEN:"Love is not easily offended, not self-seeking, keeps no record of wrongs."}],applicationAF:"Hierdie week: Voor jy praat of post, vra: Is dit waar, is dit nodig, is dit liefdevol, sal dit iemand laat struikel? As nie, los dit.",applicationEN:"This week: Before you speak or post, ask: Is it true, is it necessary, is it loving, will it make someone stumble? If not, leave it.",prayerAF:"Here, ek kies vryheid. Ek wil nie aanstoot neem nie, en ek wil nie aanstoot gee nie. Maak my pad skoon sodat mense U deur my kan sien.",prayerEN:"Lord, I choose freedom. I don't want to take offence, and I don't want to give offence. Clear my road so people can see You through me.",questionsAF:["Waar gee jy dalk onbewustelik aanstoot?","Wat beteken vryheid regtig vir jou na hierdie 6 weke?","Wie kan jy help om vry te kom deur self vry te leef?"],questionsEN:["Where might you unknowingly give offence?","What does freedom really mean to you after these 6 weeks?","Who can you help become free by living free yourself?"]}];function bu(){let[e,n]=hn.useState("AF"),[t,r]=hn.useState(1),[l,o]=hn.useState(0);hn.useEffect(()=>{let s=window.location.hash;if(s){let c=s.match(/week-(\d)/);if(c){let p=parseInt(c[1]);if(p>=1&&p<=6)r(p)}}},[]),hn.useEffect(()=>{let s=`#week-${t}`;if(window.location
