oorgestelde: dit maak jou stadig om kwaad te word. God noem dit eer — nie skande nie — om iets te laat verbygaan. Die strik is gelaai met ‘jy behoort kwaad te wees.’ Eer is om nie te byt nie.",extra:[{refEN:"Matthew 24:10-12",refAF:"Matteus 24:10-12",textEN:"Many will be offended, will betray one another — because lawlessness abounds, love grows cold.",textAF:"Baie sal aanstoot neem en mekaar verraai — omdat die wetteloosheid toeneem, verkoel die liefde.",version:"ESV"},{refEN:"Colossians 3:13",refAF:"Kolossense 3:13",textEN:"Bearing with one another and forgiving as the Lord forgave you.",textAF:"Verdra mekaar en vergewe soos die Here julle vergewe het.",version:"AFR83"},{refEN:"Ecclesiastes 7:21-22",refAF:"Prediker 7:21-22",textEN:"Do not take to heart all people say — you too have cursed others.",textAF:"Moenie alles ter harte neem wat mense sê nie — jy self het ook ander vervloek.",version:"NIV"}],applicationEN:"This week, when you feel the heat rise, pause 90 seconds. Breathe. Whisper: ‘It is my glory to overlook.’ Don’t send the message. Don’t rehearse the story three times. Pray for the person by name. Serve someone else that day.",applicationAF:"Hierdie week, wanneer jy die hitte voel opstoot, wag 90 sekondes. Asem. Fluister: ‘Dit is my eer om te vergeet.’ Moenie die boodskap stuur nie. Moenie die storie drie keer oorvertel nie. Bid vir die persoon by die naam. Bedien iemand anders daardie dag.",prayerEN:"Father, give me sekel today — clear, slow wisdom. I release my right to be offended. Let Your glory be my covering. In Jesus’ name, amen.",prayerAF:"Vader, gee my vandag sekel — helder, stadige wysheid. Ek laat vaar my reg om aanstoot te neem. Laat U eer my bedekking wees. In Jesus Naam, amen.",questionsEN:["When last did you feel the bait of offense? What did you do?","What does ‘it is his glory to overlook’ mean practically in your home?","Who do you need to release this week without needing an apology first?"],questionsAF:["Wanneer laas het jy die aas van aanstoot gevoel? Wat het jy gedoen?","Wat beteken ‘dit is sy eer om te vergeet’ prakties in jou huis?","Wie moet jy hierdie week loslaat sonder om eers 'n verskoning te eis?"],greekWord:"sekel",greekDefEN:"insight, prudence that slows anger",greekDefAF:"insig, bedagsaamheid wat toorn vertraag"},{id:2,refEN:"Galatians 5:11",refAF:"Galasiërs 5:11",titleEN:"When the Cross Offends",titleAF:"Wanneer die kruis aanstoot gee",mainEN:"But if I, brothers, still preach circumcision, why am I still being persecuted? In that case the offense of the cross has been removed.",mainAF:"En ek, broeders, as ek nog die besnydenis verkondig, waarom word ek dan nog vervolg? Dan het die aanstoot van die kruis mos verval.",mainVersion:"AFR83",storyEN:"Johan built his logistics company on being right, tough, and self-made. When a young pastor said, ‘Johan, you can’t save yourself,’ Johan felt exposed, angry. The cross offended his résumé. He stayed away for three weeks. Then he read Galatians 5:11 — the cross will always offend self-righteousness because grace cannot be earned. He came back, not with a business plan, but with empty hands.",storyAF:"Johan het sy logistieke maatskappy gebou op reg wees, sterk wees, selfgemaak. Toe 'n jong pastoor sê: ‘Johan, jy kan jouself nie red nie,’ voel Johan ontbloot, kwaad. Die kruis het sy CV aanstoot gegee. Hy bly drie weke weg. Toe lees hy Galasiërs 5:11 — die kruis sal altyd selfgeregtigheid aanstoot gee, want genade kan nie verdien word nie. Hy kom terug, nie met 'n besigheidsplan nie, maar met leë hande.",meaningEN:"Paul says: if I make the gospel easier, no one is offended — but then it’s not the gospel. Skandalon, the Greek for offense, is the stick that trips you. The cross trips our pride. If we remove the offense to be liked, we remove the power to save.",meaningAF:"Paulus sê: as ek die evangelie makliker maak, neem niemand aanstoot nie — maar dan is dit nie die evangelie nie. Skandalon, Grieks vir aanstoot, is die stok wat jou laat struikel. Die kruis laat ons trots struikel. As ons die aanstoot verwyder om geliefd te wees, verwyder ons die krag om te red.",extra:[{refEN:"1 Corinthians 1:23",refAF:"1 Korintiërs 1:23",textEN:"We preach Christ crucified, a stumbling block to Jews and folly to Gentiles.",textAF:"Ons verkondig Christus wat gekruisig is — 'n struikelblok vir Jode en dwaasheid vir heidene.",version:"ESV"},{refEN:"Romans 9:33",refAF:"Romeine 9:33",textEN:"Behold, I lay a stone of stumbling and a rock of offense.",textAF:"Kyk, Ek lê 'n struikelblok en 'n rots wat aanstoot gee.",version:"AFR53"},{refEN:"Luke 7:23",refAF:"Lukas 7:23",textEN:"And blessed is the one who is not offended by me.",textAF:"En gelukkig is hy wat nie aan My aanstoot neem nie.",version:"AFR83"}],applicationEN:"Name one place where you soften the gospel to avoid offense. This week, speak the truth with tears, not pride. Let the cross offend the right thing — your ego, not your neighbor.",applicationAF:"Noem een plek waar jy die evangelie versag om aanstoot te vermy. Hierdie week, praat die waarheid met trane, nie trots nie. Laat die kruis die regte ding aanstoot gee — jou ego, nie jou naaste nie.",prayerEN:"Jesus, thank You for being my offense and my rescue. Forgive me for making You more palatable. I embrace Your cross, even when it humbles me. Amen.",prayerAF:"Jesus, dankie dat U my aanstoot en my redding is. Vergewe my dat ek U meer aanvaarbaar wil maak. Ek omhels U kruis, selfs wanneer dit my verneder. Amen.",questionsEN:["What part of the cross offends you most today — surrender, forgiveness, dependence?","How do you try to remove that offense to be liked?","Where is God calling you to stand in grace, even if misunderstood?"],questionsAF:["Watter deel van die kruis gee jou vandag die meeste aanstoot — oorgawe, vergifnis, afhanklikheid?","Hoe probeer jy daardie aanstoot verwyder om geliefd te wees?","Waar roep God jou om in genade te staan, selfs as jy misverstaan word?"],greekWord:"skandalon",greekDefEN:"trap-stick, the bait that makes you fall",greekDefAF:"valstok, die aas wat jou laat val"},{id:3,refEN:"Proverbs 18:19",refAF:"Spreuke 18:19",titleEN:"Walls Higher Than a City",titleAF:"Mure hoër as 'n stad",mainEN:"A brother offended is more unyielding than a strong city, and quarreling is like the bars of a castle.",mainAF:"'n Broer wat gegrief is, is erger as 'n sterk stad; en twiste is soos die grendels van 'n vesting.",mainVersion:"AFR53",storyEN:"Two sisters, Noma and Zinhle, fought over who should care for their mother. One WhatsApp message — ‘You never help’ — became a fortress. For eight months they passed each other at church without greeting. The pastor showed them Proverbs 18:19 on a napkin: offense builds bars. They had to choose a door, not a wall. Noma sent a voice note: ‘I was hurt, not angry. Can we talk?’ The castle cracked.",storyAF:"Twee susters, Noma en Zinhle, baklei oor wie vir hulle ma moet sorg. Een WhatsApp — ‘Jy help nooit’ — word 'n vesting. Agt maande lank stap hulle by die kerk verby sonder om te groet. Die pastoor wys hulle Spreuke 18:19 op 'n servet: aanstoot bou grendels. Hulle moes 'n deur kies, nie 'n muur nie. Noma stuur 'n stemboodskap: ‘Ek was seergemaak, nie kwaad nie. Kan ons praat?’ Die kasteel kraak.",meaningEN:"This is the key text that explains why offense feels so safe. An offended brother feels justified, fortified. Quarreling becomes security. But a fortified city with no trade dies. Unforgiveness starves relationships.",meaningAF:"Hierdie is die sleutelteks wat verduidelik hoekom aanstoot so veilig voel. 'n Gegriefde broer voel geregverdig, versterk. Twis word sekuriteit. Maar 'n versterkte stad met geen handel nie, sterf. Onvergewensgesindheid laat verhoudings verhonger.",extra:[{refEN:"Matthew 18:15",refAF:"Matteus 18:15",textEN:"If your brother sins against you, go and tell him his fault between you and him alone.",textAF:"As jou broeder teen jou sondig, gaan wys hom tereg onder vier oë.",version:"ESV"},{refEN:"Ephesians 4:26-27",refAF:"Efesiërs 4:26-27",textEN:"Do not let the sun go down on your anger, give no opportunity to the devil.",textAF:"Laat die son nie oor julle toorn ondergaan nie, en gee geen plek aan die duiwel nie.",version:"NIV"},{refEN:"James 1:19",refAF:"Jakobus 1:19",textEN:"Let every person be quick to hear, slow to speak, slow to anger.",textAF:"Elke mens moet gou wees om te hoor, stadig om te praat, stadig om kwaad te word.",version:"AFR83"}],applicationEN:"Draw your wall. Who are you not talking to? Write one sentence of your hurt without blame: ‘I felt… when…’ Send it today, before sunset. Don’t wait for them to knock.",applicationAF:"Teken jou muur. Met wie praat jy nie? Skryf een sin van jou seer sonder verwyt: ‘Ek het gevoel… toe…’ Stuur dit vandag, voor sononder. Moenie wag dat hulle klop nie.",prayerEN:"Holy Spirit, show me my bars and bolts. I don’t want a safe, lonely castle. Teach me the courage to open a door. Amen.",prayerAF:"Heilige Gees, wys my my grendels en slotte. Ek wil nie 'n veilige, eensame kasteel hê nie. Leer my die moed om 'n deur oop te maak. Amen.",questionsEN:["What ‘castle’ have you built around a past hurt? How has it protected and isolated you?","What would it look like to go ‘between you and him alone’ this week?","How does going quickly (Eph 4:26) change the power of offense?"],questionsAF:["Watter ‘kasteel’ het jy om 'n ou seer gebou? Hoe het dit jou beskerm en geïsoleer?","Hoe sal dit lyk om ‘onder vier oë’ te gaan hierdie week?","Hoe verander om gou te gaan (Ef 4:26) die krag van aanstoot?"],greekWord:"ochoχυroma",greekDefEN:"fortified place — mindsets that exalt against knowing God",greekDefAF:"vesting — denkpatrone wat hulle verhef teen kennis van God"},{id:4,refEN:"Proverbs 12:1",refAF:"Spreuke 12:1",titleEN:"Loving Correction",titleAF:"Tug liefhê",mainEN:"Whoever loves discipline loves knowledge, but he who hates reproof is stupid.",mainAF:"Wie tug liefhet, het kennis lief; maar wie teregwysing haat, is dom.",mainVersion:"AFR83",storyEN:"Lindi, Grade 11, loved praise but hated correction. When her maths teacher said, ‘You’re bright but lazy,’ she took deep offense and stopped trying. Her marks dropped. Her mentor asked, ‘Do you love knowledge, or just compliments?’ Proverbs 12:1 stung, then freed her. She went back: ‘Teach me how to work hard.’ The offense had stolen a year; discipline gave it back.",storyAF:"Lindi, graad 11, is lief vir lof maar haat teregwysing. Toe haar wiskunde-onderwyser sê: ‘Jy is slim maar lui,’ neem sy diep aanstoot en hou op probeer. Haar punte val. Haar mentor vra: ‘Is jy lief vir kennis, of net vir komplimente?’ Spreuke 12:1 steek, toe bevry dit haar. Sy gaan terug: ‘Leer my hoe om hard te werk.’ Die aanstoot het 'n jaar gesteel; tug gee dit terug.",meaningEN:"We take offense at correction because we confuse identity with performance. Biblical rebuke is not rejection; it is invitation. To hate reproof is to choose to stay foolish. To love discipline is to love becoming wise.",meaningAF:"Ons neem aanstoot by teregwysing omdat ons identiteit met prestasie verwar. Bybelse teregwysing is nie verwerping nie; dis uitnodiging. Om teregwysing te haat, is om te kies om dwaas te bly. Om tug lief te hê, is om lief te wees om wys te word.",extra:[{refEN:"Hebrews 12:6",refAF:"Hebreërs 12:6",textEN:"The Lord disciplines the one he loves, and chastises every son whom he receives.",textAF:"Want die Here tugtig hom wat Hy liefhet, en Hy kasty elke seun wat Hy aanneem.",version:"AFR53"},{refEN:"Proverbs 15:32",refAF:"Spreuke 15:32",textEN:"He who ignores instruction despises himself, but he who listens to reproof gains intelligence.",textAF:"Wie tug verwerp, verag homself; maar wie na teregwysing luister, verwerf verstand.",version:"ESV"},{refEN:"Psalm 141:5",refAF:"Psalm 141:5",textEN:"Let a righteous man strike me — it is a kindness; let him rebuke me.",textAF:"Laat die regverdige my slaan — dit is goedertierenheid; laat hy my bestraf.",version:"NIV"}],applicationEN:"Ask one trusted person: ‘Where am I blind?’ Don’t defend for 5 minutes, just write. Thank them. Pray Psalm 141:5 for three days — let rebuke be kindness.",applicationAF:"Vra een betroubare persoon: ‘Waar is ek blind?’ Moenie vir 5 minute verdedig nie, skryf net. Bedank hulle. Bid Psalm 141:5 vir drie dae — laat bestraffing goedertierenheid wees.",prayerEN:"Father, I confess I love comfort more than growth. Give me a soft heart for hard words that are true. Let correction be kindness to me. Amen.",prayerAF:"Vader, ek bely ek is meer lief vir gemak as vir groei. Gee my 'n sagte hart vir harde woorde wat waar is. Laat teregwysing vir my goedertierenheid wees. Amen.",questionsEN:["When last did correction feel like rejection? What did you believe about yourself?","What is the difference between an attack and a kindness that stings?","Who has permission to correct you, and have you thanked them lately?"],questionsAF:["Wanneer laas het teregwysing soos verwerping gevoel? Wat het jy oor jouself geglo?","Wat is die verskil tussen 'n aanval en 'n goedertierenheid wat steek?","Wie het toestemming om jou te korrigeer, en het jy hulle onlangs bedank?"],greekWord:"paideia",greekDefEN:"training, discipline that shapes a child to maturity",greekDefAF:"opleiding, tug wat 'n kind tot volwassenheid vorm"},{id:5,refEN:"1 Corinthians 10:32",refAF:"1 Korintiërs 10:32",titleEN:"Give No Offense",titleAF:"Wees geen aanstoot nie",mainEN:"Give no offense to Jews or to Greeks or to the church of God.",mainAF:"Moenie vir Jode of Grieke of vir die gemeente van God 'n struikelblok wees nie.",mainVersion:"AFR83",storyEN:"Paul and Barnabas had just led a city to faith. The next town argued about food offered to idols. Some believers said, ‘We are free!’ Others were crushed. Paul could have said, ‘Get over it.’ Instead he wrote: Give no offense. Not because truth doesn’t matter, but because love limits liberty. On their team, young Timothy noticed Paul ate differently when weak believers were present. Freedom stayed, but love led.",storyAF:"Paulus en Barnabas het pas 'n stad tot geloof gelei. Die volgende dorp stry oor afgodsoffers. Sommige gelowiges sê: ‘Ons is vry!’ Ander is geknak. Paulus kon gesê het: ‘Kom daaroor.’ In plaas daarvan skryf hy: Wees geen aanstoot nie. Nie omdat waarheid nie saak maak nie, maar omdat liefde vryheid beperk. Op hulle span merk jong Timoteus op Paulus eet anders wanneer swak gelowiges daar is. Vryheid bly, maar liefde lei.",meaningEN:"There are two ditches: taking offense easily, and giving offense carelessly. This verse is about the second. Proskomma — to put a stumbling stone in someone’s path. The strong are called to lay down rights so the weak can walk.",meaningAF:"Daar is twee slote: maklik aanstoot neem, en sorgeloos aanstoot gee. Hierdie vers gaan oor die tweede. Proskomma — om 'n struikelblok in iemand se pad te sit. Die sterkes word geroep om regte neer te lê sodat die swakkes kan loop.",extra:[{refEN:"Romans 14:13",refAF:"Romeine 14:13",textEN:"Decide never to put a stumbling block or hindrance in the way of a brother.",textAF:"Besluit liewer om geen struikelblok of hindernis in die weg van 'n broeder te plaas nie.",version:"ESV"},{refEN:"2 Corinthians 6:3",refAF:"2 Korintiërs 6:3",textEN:"We put no obstacle in anyone's way, so that no fault may be found with our ministry.",textAF:"Ons gee in geen opsig enige aanstoot nie, sodat die bediening nie belaster word nie.",version:"AFR53"},{refEN:"Acts 24:16",refAF:"Handelinge 24:16",textEN:"I always take pains to have a clear conscience toward God and man.",textAF:"Daarom oefen ek my ook om altyd 'n onergerlike gewete te hê teenoor God en die mense.",version:"AFR83"}],applicationEN:"This week audit one freedom: music, food, drink, language, social media. Ask: Does this build up? Does this cause my brother to stumble? Practice one voluntary limit for love’s sake.",applicationAF:"Doen hierdie week oudit van een vryheid: musiek, kos, drank, taal, sosiale media. Vra: Bou dit op? Laat dit my broer struikel? Oefen een vrywillige beperking ter wille van liefde.",prayerEN:"Lord, I love my rights. Teach me to love Your people more. Make me quick to lay down what I may do, for what love must do. Amen.",prayerAF:"Here, ek is lief vir my regte. Leer my om U mense meer lief te hê. Maak my gou om neer te lê wat ek mag doen, vir wat liefde moet doen. Amen.",questionsEN:["Where might your freedom be another’s stumbling block?","How do you discern between legalism and love-limited liberty?","What would ‘clear conscience toward God and man’ require you to change this week?"],questionsAF:["Waar kan jou vryheid 'n ander se struikelblok wees?","Hoe onderskei jy tussen wettisisme en liefde-beperkte vryheid?","Wat sal ‘'n onergerlike gewete teenoor God en mense’ van jou vra om hierdie week te verander?"],greekWord:"proskomma",greekDefEN:"stumbling block placed in path of another",greekDefAF:"struikelblok wat in 'n ander se pad geplaas word"},{id:6,refEN:"Psalm 119:165",refAF:"Psalm 119:165",titleEN:"Great Peace, No Stumbling",titleAF:"Groot vrede, geen struikelblok",mainEN:"Great peace have those who love your law; nothing can make them stumble.",mainAF:"Die wat u wet liefhet, geniet groot vrede; vir hulle is daar geen struikelblok nie.",mainVersion:"ESV",storyEN:"Mara is 71. She washes feet at her church’s Maundy Thursday service — including the woman who gossiped about her. People asked why. She said, ‘I used to keep a list of who hurt me. My chest hurt. Then I started loving the Word more than my wound. Psalm 119:165 became true: great peace came, and the struikelblok lost its grip. Peace is not the absence of offense, but presence of love for the law.’",storyAF:"Mara is 71. Sy was voete by haar kerk se Witte Donderdag-diens — insluitend die vrou wat oor haar geskinder het. Mense vra hoekom. Sy sê: ‘Ek het vroeër 'n lys gehou van wie my seergemaak het. My bors het seer gemaak. Toe begin ek die Woord meer liefhê as my wond. Psalm 119:165 het waar geword: groot vrede het gekom, en die struikelblok het sy greep verloor. Vrede is nie die afwesigheid van aanstoot nie, maar die teenwoordigheid van liefde vir die wet.’",meaningEN:"This is the promise at the end of the journey. Loving God’s law more than your hurt creates shalom that cannot be tripped. The same word for stumbling — mikshol — is what disappears when love is greater. Peace is not fragile; it is fortified by love for Scripture.",meaningAF:"Dit is die belofte aan die einde van die reis. Om God se wet meer lief te hê as jou seer skep shalom wat nie laat struikel kan word nie. Dieselfde woord vir struikelblok — mikshol — is wat verdwyn wanneer liefde groter is. Vrede is nie broos nie; dit word versterk deur liefde vir die Skrif.",extra:[{refEN:"Isaiah 26:3",refAF:"Jesaja 26:3",textEN:"You keep him in perfect peace whose mind is stayed on you.",textAF:"U sal 'n standvastige gesindheid in volle vrede bewaar, want hy vertrou op U.",version:"ESV"},{refEN:"Philippians 4:7",refAF:"Filippense 4:7",textEN:"And the peace of God, which surpasses all understanding, will guard your hearts.",textAF:"En die vrede van God wat alle verstand te bowe gaan, sal julle harte bewaar.",version:"AFR83"},{refEN:"John 14:27",refAF:"Johannes 14:27",textEN:"Peace I leave with you; my peace I give to you. Not as the world gives.",textAF:"Vrede laat Ek vir julle na; my vrede gee Ek vir julle. Nie soos die wêreld gee nie.",version:"NIV"}],applicationEN:"Choose one verse from this study to memorize, word-perfect. Put it on your fridge, your lock screen, your steering wheel. When offense knocks, answer with the verse out loud. Love for law displaces love for grudge.",applicationAF:"Kies een vers uit hierdie studie om woord-vir-woord te memoriseer. Sit dit op jou yskas, jou sluitskerm, jou stuurwiel. Wanneer aanstoot klop, antwoord hardop met die vers. Liefde vir die wet verplaas liefde vir wrok.",prayerEN:"Father of peace, I have loved my list of hurts more than Your Word. Today I choose love for Your l
