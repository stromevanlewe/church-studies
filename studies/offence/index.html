Code:"LUK.17.1"}],application_en:"This week, notice the moment you feel the snap. Don't feed the story. Pause, breathe, ask: Is this truth or is this a trap? Choose to keep the door of your heart open to God, not locked by what someone did.",application_af:"Hierdie week, let op die oomblik wanneer jy die klap voel. Moenie die storie voed nie. Pouse, asem, vra: Is dit waarheid of is dit 'n strik? Kies om die deur van jou hart oop te hou vir God, nie gesluit deur wat iemand gedoen het nie.",prayer_en:"Jesus, show me where I've taken the bait. I want a free heart more than being right. Heal the places where offence lives.",prayer_af:"Jesus, wys my waar ek die aas gevat het. Ek wil 'n vry hart hê meer as om reg te wees. Genees die plekke waar aanstoot bly.",questions_en:["When last did you feel offended? What was the trigger?","What is the difference between feeling hurt and choosing offence?","How does offence become a wall between people and God?"],questions_af:["Wanneer laas het jy aanstoot geneem? Wat was die sneller?","Wat is die verskil tussen seergemaak voel en kies om aanstoot te neem?","Hoe word aanstoot 'n muur tussen mense en God?"]},{id:"week-2",number:2,title_en:"How Offence Grows",title_af:"Hoe Aanstoot Groei",theme_en:"From hurt to prison",theme_af:"Van seer tot tronk",story_en:"Cain was offended that God accepted Abel's offering. That small offence, left unchecked, grew into anger, then lies, then murder. God even warned him: sin is crouching at the door. Offence always wants more room.",story_af:"Kain het aanstoot geneem dat God Abel se offer aanvaar het. Daardie klein aanstoot, as dit nie hanteer word nie, het gegroei tot woede, toe leuens, toe moord. God het hom selfs gewaarsku: sonde lê en loer by die deur. Aanstoot wil altyd meer spasie hê.",teaching_en:"Undealt offence follows a pattern: Hurt → Offence → Anger → Judgment → Prison. We start replaying conversations, collecting evidence, telling our side. Our heart gets hard and tired. The Bible says offence comes, but we don't have to live there. Forgiveness is not pretending it didn't hurt, it's refusing to carry it forever.",teaching_af:"Onhanteerde aanstoot volg 'n patroon: Seer → Aanstoot → Woede → Oordeel → Tronk. Ons begin gesprekke oor en oor speel, bewyse versamel, ons kant vertel. Ons hart word hard en moeg. Die Bybel sê aanstoot kom, maar ons hoef nie daar te bly nie. Vergifnis is nie om te maak of dit nie seergemaak het nie, dis om te weier om dit vir altyd te dra.",greek:{word:"προσκόπτω",translit:"proskopto",def_en:"to stumble, to strike against; to be offended and lose forward momentum",def_af:"om te struikel, om teen iets te stamp; om aanstoot te neem en vorentoe momentum te verloor"},scriptures:[{ref_en:"Genesis 4:3-8",ref_af:"Genesis 4:3-8",bookCode:"GEN.4.3-8"},{ref_en:"Proverbs 18:19",ref_af:"Spreuke 18:19",bookCode:"PRO.18.19"},{ref_en:"Hebrews 12:15",ref_af:"Hebreërs 12:15",bookCode:"HEB.12.15"}],application_en:"If offence grows when we water it, it shrinks when we starve it. This week practice stopping the replay. When the thought comes, replace it with truth: God saw it, God is my defender, I will not build a case.",application_af:"As aanstoot groei wanneer ons dit water gee, krimp dit wanneer ons dit laat verhonger. Oefen hierdie week om die herhaling te stop. Wanneer die gedagte kom, vervang dit met waarheid: God het dit gesien, God is my verdediger, ek sal nie 'n saak bou nie.",prayer_en:"Father, I bring you the replay in my mind. I don't want bitterness to take root. Uproot what I planted in offence.",prayer_af:"Vader, ek bring vir U die herhaling in my gedagtes. Ek wil nie hê bitterheid moet wortel skiet nie. Trek uit wat ek in aanstoot geplant het.",questions_en:["Which step do you get stuck on: hurt, anger, judgment?","What 'evidence' have you been collecting against someone?","What would it look like to starve offence this week?"],questions_af:["Op watter stap bly jy vas: seer, woede, oordeel?","Watter 'bewyse' het jy teen iemand versamel?","Hoe sal dit lyk om aanstoot hierdie week te laat verhonger?"]},{id:"week-3",number:3,title_en:"Jesus and Offence",title_af:"Jesus en Aanstoot",theme_en:"The One who was never trapped",theme_af:"Die Een wat nooit vasgevang was nie",story_en:"People called Jesus names, misunderstood Him, betrayed Him, and finally crucified Him. He had every reason to be offended - yet He never took offence. On the cross He said, Father forgive them. He showed us: you can feel deep pain and still stay free.",story_af:"Mense het Jesus name genoem, Hom verkeerd verstaan, Hom verraai, en Hom uiteindelik gekruisig. Hy het elke rede gehad om aanstoot te neem - tog het Hy nooit aanstoot geneem nie. Aan die kruis het Hy gesê, Vader vergeef hulle. Hy het ons gewys: jy kan diep pyn voel en steeds vry bly.",teaching_en:"Jesus warned that in this world you will be offended, but He lived offence-proof. How? He knew who He was, He trusted His Father to be Judge, and He didn't live for people's approval. When your identity is secure in God, offence loses its power. You stop needing everyone to get you.",teaching_af:"Jesus het gewaarsku dat jy in hierdie wêreld aanstoot sal kry, maar Hy het vry van aanstoot geleef. Hoe? Hy het geweet wie Hy is, Hy het Sy Vader vertrou om Regter te wees, en Hy het nie vir mense se goedkeuring geleef nie. Wanneer jou identiteit veilig is in God, verloor aanstoot sy krag. Jy hou op om te benodig dat almal jou verstaan.",greek:{word:"ἄκακος",translit:"akakos",def_en:"innocent, without guile; free from offence towards others",def_af:"onskuldig, sonder bedrog; vry van aanstoot teenoor ander"},scriptures:[{ref_en:"John 16:1",ref_af:"Johannes 16:1",bookCode:"JHN.16.1"},{ref_en:"1 Peter 2:23",ref_af:"1 Petrus 2:23",bookCode:"1PE.2.23"},{ref_en:"Luke 23:34",ref_af:"Lukas 23:34",bookCode:"LUK.23.34"}],application_en:"You can't control what people say, but you can control what you carry. Practice Jesus' way: before you defend yourself, bring it to the Father. Ask, what does God say about me right now?",application_af:"Jy kan nie beheer wat mense sê nie, maar jy kan beheer wat jy dra. Oefen Jesus se manier: voordat jy jouself verdedig, bring dit na die Vader. Vra, wat sê God nou oor my?",prayer_en:"Jesus, teach me Your way. You were wounded but never trapped. Keep my heart soft and my hands open.",prayer_af:"Jesus, leer my U manier. U was gewond maar nooit vasgevang nie. Hou my hart sag en my hande oop.",questions_en:["How did Jesus respond when He was misunderstood?","Where do you look for approval when you feel offended?","What would change if you trusted God as Judge?"],questions_af:["Hoe het Jesus gereageer toe Hy verkeerd verstaan is?","Waar soek jy goedkeuring wanneer jy aanstoot neem?","Wat sal verander as jy God as Regter vertrou?"]},{id:"week-4",number:4,title_en:"Forgiveness Opens the Door",title_af:"Vergifnis Maak die Deur Oop",theme_en:"Release, don't carry",theme_af:"Laat los, moet nie dra nie",story_en:"A Grade 10 learner told me: I forgave my dad, not because what he did was okay, but because I didn't want to carry him into every future friendship. Forgiveness is not saying it was fine. It's handing the case to God and walking out of the prison.",story_af:"'n Graad 10-leerder het vir my gesê: Ek het my pa vergewe, nie omdat wat hy gedoen het reg was nie, maar omdat ek hom nie in elke toekomstige vriendskap wil saamdra nie. Vergifnis is nie om te sê dit was reg nie. Dis om die saak vir God te gee en uit die tronk te loop.",teaching_en:"Forgiveness is a decision, then a process. You choose to release the debt - they don't owe you a perfect apology, suffering, or change. You release them to God. Sometimes you have to forgive 70x7 - the same hurt again and again until your heart believes it. Every time you release, you get lighter.",teaching_af:"Vergifnis is 'n besluit, dan 'n proses. Jy kies om die skuld vry te laat - hulle skuld jou nie 'n perfekte verskoning, lyding of verandering nie. Jy laat hulle los vir God. Soms moet jy 70x7 vergewe - dieselfde seer weer en weer totdat jou hart dit glo. Elke keer wat jy loslaat, word jy ligter.",greek:{word:"ἀφίημι",translit:"aphiemi",def_en:"to send away, to release, to let go; used for forgiveness",def_af:"om weg te stuur, om vry te laat, om te laat gaan; gebruik vir vergifnis"},scriptures:[{ref_en:"Matthew 18:21-22",ref_af:"Matteus 18:21-22",bookCode:"MAT.18.21-22"},{ref_en:"Ephesians 4:31-32",ref_af:"Efesiërs 4:31-32",bookCode:"EPH.4.31-32"},{ref_en:"Colossians 3:13",ref_af:"Kolossense 3:13",bookCode:"COL.3.13"}],application_en:"Make a small list: who are you still carrying? Pray: Father, I release [name] from owing me. I give you the case. I choose freedom today. You don't need to feel it perfectly to decide it truly.",application_af:"Maak 'n klein lysie: wie dra jy nog? Bid: Vader, ek laat [naam] los van wat hy/sy my skuld. Ek gee die saak vir U. Ek kies vandag vryheid. Jy hoef dit nie perfek te voel om dit werklik te besluit nie.",prayer_en:"Father, I release them. I release me. As You forgave me, I forgive them. Heal my heart as I obey.",prayer_af:"Vader, ek laat hulle los. Ek laat my los. Soos U my vergewe het, vergewe ek hulle. Genees my hart terwyl ek gehoorsaam.",questions_en:["What does forgiveness NOT mean?","Why does Jesus link our freedom to forgiving others?","Who do you need to release this week?"],questions_af:["Wat beteken vergifnis NIE?","Hoekom koppel Jesus ons vryheid aan ander vergewe?","Wie moet jy hierdie week loslaat?"]},{id:"week-5",number:5,title_en:"Give No Offence - Paul & Barnabas",title_af:"Gee Geen Aanstoot Nie - Paulus & Barnabas",theme_en:"Love that doesn't trip others",theme_af:"Liefde wat nie ander laat struikel nie",story_en:"Paul and Barnabas had a sharp disagreement about John Mark. It was so sharp they split ways. Yet later, Paul asks for Mark because he is useful to him. They didn't let offence write the final chapter. They gave no offence as a lifestyle - not being perfect, but refusing to make others stumble.",story_af:"Paulus en Barnabas het 'n skerp meningsverskil oor Johannes Markus gehad. Dit was so skerp dat hulle paaie geskei het. Tog vra Paulus later vir Markus omdat hy nuttig vir hom is. Hulle het nie toegelaat dat aanstoot die laaste hoofstuk skryf nie. Hulle het geen aanstoot gegee as 'n leefstyl - nie om perfek te wees nie, maar om te weier om ander te laat struikel.",teaching_en:"The Bible says: Give no offence to Jew, Greek, or the church (1 Cor 10:32). That doesn't mean everyone will like you. It means you live thoughtfully - you don't use freedom to wound, you don't gossip, you don't flaunt. Paul chose to limit himself so others could meet Jesus. Barnabas was called son of encouragement - he built bridges. Giving no offence is love with manners.",teaching_af:"Die Bybel sê: Gee geen aanstoot aan Jood, Griek of die gemeente nie (1 Kor 10:32). Dit beteken nie almal sal van jou hou nie. Dit beteken jy leef bedagsaam - jy gebruik nie vryheid om te wond nie, jy skinder nie, jy pronk nie. Paulus het gekies om homself te beperk sodat ander Jesus kan ontmoet. Barnabas is seun van bemoediging genoem - hy het brûe gebou. Om geen aanstoot te gee nie is liefde met maniere.",greek:{word:"ἀπρόσκοπος",translit:"aproskopos",def_en:"without causing to stumble; not leading others into offence",def_af:"sonder om te laat struikel; om nie ander in aanstoot te lei nie"},scriptures:[{ref_en:"Acts 15:36-41",ref_af:"Handelinge 15:36-41",bookCode:"ACT.15.36-41"},{ref_en:"1 Corinthians 10:32-33",ref_af:"1 Korintiërs 10:32-33",bookCode:"1CO.10.32-33"},{ref_en:"2 Timothy 4:11",ref_af:"2 Timoteus 4:11",bookCode:"2TI.4.11"}],application_en:"This week, ask two questions before you post, speak, or react: Will this build or break? Will this help someone meet Jesus or make it harder? Giving no offence is not people-pleasing - it's people-loving.",application_af:"Vra hierdie week twee vrae voordat jy plaas, praat of reageer: Sal dit bou of breek? Sal dit iemand help om Jesus te ontmoet of dit moeiliker maak? Om geen aanstoot te gee nie is nie mense-pleasing nie - dis mense-liefde.",prayer_en:"Holy Spirit, make me like Barnabas - an encourager. Show me where my freedom trips someone else. Teach me to give no offence.",prayer_af:"Heilige Gees, maak my soos Barnabas - 'n bemoediger. Wys my waar my vryheid iemand anders laat struikel. Leer my om geen aanstoot te gee nie.",questions_en:["How did Paul and Barnabas handle their disagreement differently than most?","What is the difference between giving no offence and people-pleasing?","Where can you choose encouragement over offence this week?"],questions_af:["Hoe het Paulus en Barnabas hul meningsverskil anders hanteer as meeste mense?","Wat is die verskil tussen geen aanstoot gee en mense-pleasing?","Waar kan jy hierdie week bemoediging bo aanstoot kies?"]},{id:"week-6",number:6,title_en:"Live Free",title_af:"Leef Vry",theme_en:"A lifestyle without the bait",theme_af:"’n Leefstyl sonder die aas",story_en:"The trap will always be set. Offence will come - someone will forget you, misread you, hurt you. But you can walk past the trap every time. Free people don't have no enemies; they have no prison. They have learned: I can be hurt and still be whole.",story_af:"Die strik sal altyd gestel wees. Aanstoot sal kom - iemand sal jou vergeet, jou verkeerd lees, jou seermaak. Maar jy kan elke keer by die strik verbyloop. Vry mense het nie geen vyande nie; hulle het geen tronk nie. Hulle het geleer: ek kan seergemaak wees en steeds heel wees.",teaching_en:"Living free from offence needs daily habits: 1) Quick to forgive, slow to take offence. 2) Keep short accounts - don't let the sun go down on your anger. 3) Speak life, not offence. 4) Stay close to Jesus - a heart full of worship has no room for offence. The trap loses power when your heart is full.",teaching_af:"Om vry van aanstoot te leef het daaglikse gewoontes nodig: 1) Vinnig om te vergewe, stadig om aanstoot te neem. 2) Hou kort rekeninge - moenie die son oor jou woede laat ondergaan nie. 3) Praat lewe, nie aanstoot nie. 4) Bly naby Jesus - 'n hart vol aanbidding het geen plek vir aanstoot nie. Die strik verloor krag wanneer jou hart vol is.",greek:{word:"ἐλευθερία",translit:"eleutheria",def_en:"freedom, liberty; to live as one not bound by offence",def_af:"vryheid, vrymaking; om te leef as iemand wat nie gebind is deur aanstoot nie"},scriptures:[{ref_en:"Psalm 119:165",ref_af:"Psalm 119:165",bookCode:"PSA.119.165"},{ref_en:"Philippians 4:8",ref_af:"Filippense 4:8",bookCode:"PHP.4.8"},{ref_en:"Romans 12:18",ref_af:"Romeine 12:18",bookCode:"ROM.12.18"}],application_en:"Choose one habit for the next 7 days: At night, release the day. Say: Today I choose no offence. I bless those who hurt me. I keep my heart soft. Write down one moment each day where you walked past the trap.",application_af:"Kies een gewoonte vir die volgende 7 dae: Laat elke aand die dag los. Sê: Vandag kies ek geen aanstoot nie. Ek seën die wat my seergemaak het. Ek hou my hart sag. Skryf elke dag een oomblik neer waar jy by die strik verbygeloop het.",prayer_en:"Father, I want to live free. Not easily offended, quickly forgiving, full of peace. Let my life show that offence has no home here.",prayer_af:"Vader, ek wil vry lewe. Nie maklik aanstoot neem nie, vinnig vergewe, vol vrede. Laat my lewe wys dat aanstoot hier geen tuiste het nie.",questions_en:["Which of the 4 habits do you need most right now?","What fills your heart when offence tries to enter?","How will you keep living free after this study?"],questions_af:["Watter van die 4 gewoontes het jy nou die nodigste?","Wat vul jou hart wanneer aanstoot probeer inkom?","Hoe gaan jy aanhou vry lewe na hierdie studie?"]}],Sm={MAT:"Matthew",PRO:"Proverbs",LUK:"Luke",GEN:"Genesis",HEB:"Hebrews",JHN:"John","1PE":"1 Peter",EPH:"Ephesians",COL:"Colossians",ACT:"Acts","1CO":"1 Corinthians","2TI":"2 Timothy",PSA:"Psalms",PHP:"Philippians",ROM:"Romans"};function wm({code:e}){let n=`https://ww
