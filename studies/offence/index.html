kom is nie: 'Hulle moes...'","God wil hê ons moet dit vroeg raaksien en dit nie saamdra nie."],questionsEN:["Where did I feel offended this week?","What expectation was not met?","What would it look like to let it go today?"],questionsAF:["Waar het ek hierdie week aanstoot geneem?","Watter verwagting is nie nagekom nie?","Hoe sal dit lyk om dit vandag te laat gaan?"],prayerEN:"Lord, open my eyes to see when I take offence. Help me keep my heart soft.",prayerAF:"Here, open my oë om te sien wanneer ek aanstoot neem. Help my om my hart sag te hou."},{id:"week-2",num:2,titleEN:"The trap",titleAF:"Die strik",themeEN:"Offence promises protection but brings isolation.",themeAF:"Aanstoot belowe beskerming maar bring isolasie.",keyVerse:{refEN:"Luke 17:1",refAF:"Lukas 17:1",textEN:"Jesus said to his disciples: 'Things that cause people to stumble are bound to come, but woe to anyone through whom they come.'",textAF:"En Hy het vir sy dissipels gesê: Dit is onvermydelik dat daar struikelblokke kom, maar wee hom deur wie hulle kom.",paraEN:"We can't avoid being hurt, but we can choose not to live in the trap.",paraAF:"Ons kan nie vermy om seer te kry nie, maar ons kan kies om nie in die strik te bly nie.",bookCode:"LUK",chapter:17,verse:"1"},extraVerses:[{refEN:"Psalm 119:165",refAF:"Psalm 119:165",textEN:"Great peace have those who love your law, and nothing can make them stumble.",textAF:"Die wat u wet liefhet, het groot vrede, en vir hulle is daar geen struikelblok nie.",paraEN:"Loving God's way gives stability when people disappoint.",paraAF:"Om God se manier lief te hê gee stabiliteit wanneer mense teleurstel.",bookCode:"PSA",chapter:119,verse:"165"},{refEN:"Hebrews 12:15",refAF:"Hebreërs 12:15",textEN:"See to it that no one falls short of the grace of God and that no bitter root grows up to cause trouble and defile many.",textAF:"en pas op dat niemand in die genade van God veragter nie, dat geen wortel van bitterheid opskiet en onrus verwek en baie hierdeur besoedel word nie.",paraEN:"Undealt offence grows like a bitter root.",paraAF:"Aanstoot wat nie hanteer word nie, groei soos 'n bitter wortel.",bookCode:"HEB",chapter:12,verse:"15"}],pointsEN:["The enemy uses offence to separate friends, churches, families.","The trap feels safe at first: 'I will just keep distance.'","Peace returns when we bring the hurt to God, not when we hide it."],pointsAF:["Die vyand gebruik aanstoot om vriende, kerke en families te skei.","Die strik voel eers veilig: 'Ek sal net afstand hou.'","Vrede kom terug wanneer ons die seer na God toe bring, nie wanneer ons dit wegsteek nie."],questionsEN:["Is there a relationship where I have built a wall?","What lie does the trap tell me? (e.g., 'They don't care')","Who can I talk to in a healthy way this week?"],questionsAF:["Is daar 'n verhouding waar ek 'n muur gebou het?","Watter leuen vertel die strik vir my? (bv. 'Hulle gee nie om nie')","Met wie kan ek hierdie week op 'n gesonde manier praat?"],prayerEN:"Father, I don't want to live in offence. Show me Your peace and heal the bitter places.",prayerAF:"Vader, ek wil nie in aanstoot lewe nie. Wys my U vrede en genees die bitter plekke."},{id:"week-3",num:3,titleEN:"Jesus and offence",titleAF:"Jesus en aanstoot",themeEN:"Even Jesus was not spared, yet He stayed soft.",themeAF:"Selfs Jesus is nie gespaar nie, tog het Hy sag gebly.",keyVerse:{refEN:"Matthew 11:6",refAF:"Matteus 11:6",textEN:"Blessed is anyone who does not stumble on account of me.",textAF:"En salig is elkeen wat aan My nie aanstoot neem nie.",paraEN:"Jesus says: You can be close to me even when life doesn't make sense.",paraAF:"Jesus sê: Jy kan naby aan My bly selfs wanneer die lewe nie sin maak nie.",bookCode:"MAT",chapter:11,verse:"6"},extraVerses:[{refEN:"John 6:61",refAF:"Johannes 6:61",textEN:"Aware that his disciples were grumbling about this, Jesus said to them, 'Does this offend you?'",textAF:"En Jesus het geweet dat sy dissipels hieroor murmureer en het vir hulle gesê: Neem julle hieraan aanstoot?",paraEN:"Jesus lovingly asks us directly about our offence.",paraAF:"Jesus vra ons direk en liefdevol oor ons aanstoot.",bookCode:"JHN",chapter:6,verse:"61"},{refEN:"1 Peter 2:23",refAF:"1 Petrus 2:23",textEN:"When they hurled their insults at him, he did not retaliate; when he suffered, he made no threats. Instead, he entrusted himself to him who judges justly.",textAF:"wat, toe Hy uitgeskel is, nie teruggeskel het nie; toe Hy gely het, nie gedreig het nie, maar dit oorgegee het aan Hom wat regverdig oordeel.",paraEN:"Jesus gave His hurt to the Father instead of holding it.",paraAF:"Jesus het sy seer vir die Vader gegee in plaas daarvan om dit vas te hou.",bookCode:"1PE",chapter:2,verse:"23"}],pointsEN:["People were offended by Jesus because He didn't fit their idea.","We can also be offended by God when prayers aren't answered fast.","Staying close to Jesus is the way out of offence."],pointsAF:["Mense het aanstoot aan Jesus geneem omdat Hy nie by hulle idee gepas het nie.","Ons kan ook aanstoot aan God neem wanneer gebede nie vinnig beantwoord word nie.","Om naby aan Jesus te bly is die pad uit aanstoot."],questionsEN:["Have I ever been disappointed with God?","What does it mean to trust Him even when I don't understand?","What helps me stay soft like Jesus?"],questionsAF:["Was ek al ooit teleurgesteld in God?","Wat beteken dit om Hom te vertrou selfs wanneer ek nie verstaan nie?","Wat help my om sag te bly soos Jesus?"],prayerEN:"Jesus, when I don't understand You, help me not to walk away. I choose to trust You.",prayerAF:"Jesus, wanneer ek U nie verstaan nie, help my om nie weg te loop nie. Ek kies om U te vertrou."},{id:"week-4",num:4,titleEN:"Forgiveness over offence",titleAF:"Vergifnis bo aanstoot",themeEN:"Forgiveness is not a feeling, it's a decision to release.",themeAF:"Vergifnis is nie 'n gevoel nie, dis 'n besluit om los te laat.",keyVerse:{refEN:"Colossians 3:13",refAF:"Kolosense 3:13",textEN:"Bear with each other and forgive one another if any of you has a grievance against someone. Forgive as the Lord forgave you.",textAF:"Verdra mekaar en vergewe mekaar as die een teen die ander 'n klag het; soos Christus julle vergeef het, so moet julle ook doen.",paraEN:"We forgive because we have been forgiven so much.",paraAF:"Ons vergewe omdat ons soveel vergewe is.",bookCode:"COL",chapter:3,verse:"13"},extraVerses:[{refEN:"Ephesians 4:26-27",refAF:"Efesiërs 4:26-27",textEN:"In your anger do not sin: Do not let the sun go down while you are still angry, and do not give the devil a foothold.",textAF:"Word toornig en sondig nie; laat die son nie ondergaan oor julle toorn nie; en gee aan die duiwel geen plek nie.",paraEN:"Quick forgiveness closes the door to the enemy.",paraAF:"Vinnige vergifnis maak die deur toe vir die vyand.",bookCode:"EPH",chapter:4,verse:"26-27"},{refEN:"Matthew 18:21-22",refAF:"Matteus 18:21-22",textEN:"Then Peter came to Jesus and asked, 'Lord, how many times shall I forgive my brother or sister who sins against me? Up to seven times?' Jesus answered, 'I tell you, not seven times, but seventy-seven times.'",textAF:"Toe kom Petrus na Hom en sê: Here, hoe dikwels sal my broeder teen my sondig en ek hom vergewe? Tot sewe maal toe? Jesus antwoord hom: Ek sê vir jou, nie tot sewe maal toe nie, maar tot sewentig maal sewe toe.",paraEN:"Forgiveness is a lifestyle, not a one-time event.",paraAF:"Vergifnis is 'n lewenstyl, nie 'n eenmalige gebeurtenis nie.",bookCode:"MAT",chapter:18,verse:"21-22"}],pointsEN:["Forgiveness does not say 'what you did was okay'. It says 'I won't carry this anymore'.","We can forgive and still have healthy boundaries.","Every time the memory comes, we can re-choose forgiveness."],pointsAF:["Vergifnis sê nie 'wat jy gedoen het was reg' nie. Dit sê 'ek gaan dit nie meer saamdra nie'.","Ons kan vergewe en steeds gesonde grense hê.","Elke keer wanneer die herinnering kom, kan ons weer kies om te vergewe."],questionsEN:["Who do I need to release today?","Do I need healthy boundaries too?","How does remembering how God forgave me help?"],questionsAF:["Wie moet ek vandag loslaat?","Het ek ook gesonde grense nodig?","Hoe help dit om te onthou hoe God my vergewe het?"],prayerEN:"Father, as You forgave me, I now forgive [name]. I release them into Your hands.",prayerAF:"Vader, soos U my vergewe het, vergewe ek nou [naam]. Ek gee hulle oor in U hande."},{id:"week-5",num:5,titleEN:"Paul & Barnabas – When friends disagree",titleAF:"Paulus & Barnabas – Wanneer vriende verskil",themeEN:"Even mature leaders can clash. God still uses it.",themeAF:"Selfs volwasse leiers kan bots. God gebruik dit steeds.",keyVerse:{refEN:"Acts 15:39",refAF:"Handelinge 15:39",textEN:"They had such a sharp disagreement that they parted company. Barnabas took Mark and sailed for Cyprus.",textAF:"Daar het toe verbittering ontstaan, sodat hulle van mekaar geskei het, en Bárnabas het Markus saamgeneem en na Ciprus gevaar.",paraEN:"A sharp argument split a great team. It was painful but God multiplied the mission.",paraAF:"'n Skerp argument het 'n groot span geskei. Dit was seer maar God het die sending vermeerder.",bookCode:"ACT",chapter:15,verse:"39"},extraVerses:[{refEN:"Acts 15:37-38",refAF:"Handelinge 15:37-38",textEN:"Barnabas wanted to take John, also called Mark, with them, but Paul did not think it wise to take him, because he had deserted them in Pamphylia and had not continued with them in the work.",textAF:"En Bárnabas het besluit om Johannes wat Markus genoem word, saam te neem. Maar Paulus het dit nie goedgedink om hom saam te neem wat in Pamfílië van hulle af weggegaan en nie saam met hulle na die werk gegaan het nie.",paraEN:"The issue was about trust after someone quit earlier.",paraAF:"Die kwessie was oor vertroue nadat iemand vroeër opgehou het.",bookCode:"ACT",chapter:15,verse:"37-38"},{refEN:"2 Timothy 4:11",refAF:"2 Timoteus 4:11",textEN:"Only Luke is with me. Get Mark and bring him with you, because he is helpful to me in my ministry.",textAF:"Lukas alleen is by my. Neem Markus en bring hom saam met jou, want hy is vir my van groot nut vir die diens.",paraEN:"Years later Paul says: Mark is now useful. Restoration happened.",paraAF:"Jare later sê Paulus: Markus is nou nuttig. Herstel het gebeur.",bookCode:"2TI",chapter:4,verse:"11"}],pointsEN:["Paul focused on the mission, Barnabas focused on the person. Both values matter.","They didn't pretend – they separated for a season, but didn't slander.","Later, Paul asks for Mark. God brings healing over time."],pointsAF:["Paulus het op die missie gefokus, Barnabas op die persoon. Albei waardes is belangrik.","Hulle het nie gemaak asof nie – hulle het vir 'n tyd apart gegaan, maar nie mekaar sleg gemaak nie.","Later vra Paulus vir Markus. God bring genesing oor tyd."],storyEN:"This week reminds us: disagreement doesn't have to mean disqualification. Two teams formed instead of one, and the gospel spread further.",storyAF:"Hierdie week herinner ons: verskil beteken nie diskwalifikasie nie. Twee spanne het gevorm in plaas van een, en die evangelie het verder versprei.",questionsEN:["Have I had a 'Paul & Barnabas' moment with someone?","Did I focus more on being right or on keeping the relationship?","Is there someone I need to re-invite like Paul re-invited Mark?"],questionsAF:["Het ek al 'n 'Paulus & Barnabas' oomblik met iemand gehad?","Het ek meer gefokus om reg te wees of om die verhouding te bewaar?","Is daar iemand wat ek weer moet innooi soos Paulus vir Markus ingenooi het?"],prayerEN:"Lord, when I disagree, help me stay respectful. Use even our differences for Your purpose.",prayerAF:"Here, wanneer ek verskil, help my om respekvol te bly. Gebruik selfs ons verskille vir U doel."},{id:"week-6",num:6,titleEN:"Living unoffendable",titleAF:"Lewe vry van aanstoot",themeEN:"A life that doesn't easily take offence is a peaceful life.",themeAF:"'n Lewe wat nie maklik aanstoot neem nie, is 'n vreedsame lewe.",keyVerse:{refEN:"Psalm 119:165",refAF:"Psalm 119:165",textEN:"Great peace have those who love your law, and nothing can make them stumble.",textAF:"Die wat u wet liefhet, het groot vrede, en vir hulle is daar geen struikelblok nie.",paraEN:"When we love God's Word more than our rights, we become hard to offend.",paraAF:"Wanneer ons God se Woord meer liefhet as ons regte, raak ons moeilik om aanstoot te gee.",bookCode:"PSA",chapter:119,verse:"165"},extraVerses:[{refEN:"James 1:19",refAF:"Jakobus 1:19",textEN:"My dear brothers and sisters, take note of this: Everyone should be quick to listen, slow to speak and slow to become angry.",textAF:"Daarom, my geliefde broeders, elke mens moet gou wees om te hoor, stadig om te praat, stadig om toornig te word.",paraEN:"A simple rhythm for daily life: listen fast, speak slow, anger slow.",paraAF:"'n Eenvoudige ritme vir elke dag: luister vinnig, praat stadig, word stadig kwaad.",bookCode:"JAS",chapter:1,verse:"19"},{refEN:"Philippians 2:3-4",refAF:"Filippense 2:3-4",textEN:"Do nothing out of selfish ambition or vain conceit. Rather, in humility value others above yourselves, not looking to your own interests but each of you to the interests of the others.",textAF:"Moenie iets doen uit selfsug of uit ydele eer nie, maar in nederigheid moet die een die ander hoër ag as homself. Julle moet nie elkeen na sy eie belange omsien nie, maar elkeen ook na die ander s'n.",paraEN:"Humility is the best protection against offence.",paraAF:"Nederigheid is die beste beskerming teen aanstoot.",bookCode:"PHP",chapter:2,verse:"3-4"}],pointsEN:["Unoffendable doesn't mean you never feel hurt – it means you don't stay there.","Daily habits: quick to listen, slow to speak, quick to forgive.","Pray for those who hurt you – it keeps your heart soft."],pointsAF:["Onvatbaar vir aanstoot beteken nie jy voel nooit seer nie – dit beteken jy bly nie daar nie.","Daaglikse gewoontes: vinnig om te luister, stadig om te praat, vinnig om te vergewe.","Bid vir die wat jou seermaak – dit hou jou hart sag."],questionsEN:["Wh
