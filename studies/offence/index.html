FFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQB//9k=";var js=Ut(sn(),1),dU=Symbol.for("react.element");var RU=Object.prototype.hasOwnProperty,pU=js.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,gU={key:!0,ref:!0,__self:!0,__source:!0};function Ts(e,t,n){var o,r={},i=null,l=null;n!==void 0&&(i=""+n),t.key!==void 0&&(i=""+t.key),t.ref!==void 0&&(l=t.ref);for(o in t)RU.call(t,o)&&!gU.hasOwnProperty(o)&&(r[o]=t[o]);if(e&&e.defaultProps)for(o in t=e.defaultProps,t)r[o]===void 0&&(r[o]=t[o]);return{$$typeof:dU,type:e,key:i,ref:l,props:r,_owner:pU.current}}var g=Ts,Q=Ts;var Dr=[{id:"week-1",number:1,titleAF:"Wat is aanstoot?",titleEN:"What is offence?",keyRefAF:"Spreuke 18:19",keyRefEN:"Proverbs 18:19",keyLinkAF:"https://www.bible.com/bible/5/PRO.18.19.AFR53",keyLinkEN:"https://www.bible.com/bible/111/PRO.18.19.NIV",keyTextAF:"'n Broer wat gegrief is, is erger as 'n sterk stad; en twiste is soos die grendels van 'n paleis.",keyTextEN:"A brother wronged is more unyielding than a fortified city; disputes are like the barred gates of a citadel.",storyAF:"Stel jou voor: Twee beste vriende bou saam 'n groot LEGO-kasteel. Ewe skielik trap die een per ongeluk op die ander se toring. In plaas van 'jammer sê', sê hy niks. Die ander vriend vou sy arms, draai weg en bou 'n muur tussen hulle. Daardie muur is aanstoot. Dit begin klein - 'n woord, 'n kyk, 'n boodskap wat nie beantwoord word nie - maar as ons dit vashou, word dit 'n tronk.",storyEN:"Imagine: Two best friends build a huge LEGO castle together. Suddenly one accidentally steps on the other's tower. Instead of saying sorry, he says nothing. The other friend folds his arms, turns away and builds a wall between them. That wall is offence. It starts small - a word, a look, an unanswered message - but when we hold onto it, it becomes a prison.",meaningAF:"In die Bybel is die woord vir aanstoot 'skandalon' - dit was 'n strikstokkie waarmee diere gevang is. Aanstoot is dus nie net 'ek voel seergemaak' nie. Dit is 'n strik wat die vyand gebruik om jou vas te vang. As jy aanstoot neem, byt jy vas aan die aas. Jy dink jy straf die ander persoon, maar jy sit self vas. Graad 10-waarheid: Aanstoot is 'n keuse, nie net 'n gevoel nie.",meaningEN:"In the Bible the word for offence is 'skandalon' - it was the little trigger stick that snapped a trap shut to catch animals. Offence is not just 'I feel hurt'. It is a trap the enemy uses to catch you. When you take offence, you bite the bait. You think you punish the other person, but you are the one stuck. Grade 10 truth: Offence is a choice, not just a feeling.",extras:[{refAF:"Spreuke 19:11",refEN:"Proverbs 19:11",linkAF:"https://www.bible.com/bible/5/PRO.19.11.AFR53",linkEN:"https://www.bible.com/bible/111/PRO.19.11.NIV",noteAF:"Verstandigheid maak 'n mens lankmoedig, en dit is sy eer om oortreding te vergewe.",noteEN:"A person's wisdom yields patience; it is to one's glory to overlook an offense."},{refAF:"Prediker 7:21-22",refEN:"Ecclesiastes 7:21-22",linkAF:"https://www.bible.com/bible/5/ECC.7.21-22.AFR53",linkEN:"https://www.bible.com/bible/111/ECC.7.21-22.NIV",noteAF:"Moenie ag slaan op alles wat gesê word nie - jy self het ook al sleg gepraat van ander.",noteEN:"Do not pay attention to every word people say, for you yourself know you have said bad things about others."},{refAF:"Jakobus 1:19-20",refEN:"James 1:19-20",linkAF:"https://www.bible.com/bible/5/JAS.1.19-20.AFR53",linkEN:"https://www.bible.com/bible/111/JAS.1.19-20.NIV",noteAF:"Wees gou om te hoor, stadig om te praat, stadig om kwaad te word. Mense se kwaadheid bring nie God se geregtigheid nie.",noteEN:"Be quick to listen, slow to speak and slow to become angry, because human anger does not produce God's righteousness."}],practicalAF:"Hierdie week: Wanneer jy aanstoot voel opkom (in klas, by huis, op WhatsApp), druk 'pouse'. Vra: Is dit 'n strik? Moet ek hierdie aas eet? Skryf dit in jou joernaal en besluit om dit te laat gaan voordat jy gaan slaap. Moenie met 'n muur in jou hart gaan slaap nie.",practicalEN:"This week: When you feel offence rising (in class, at home, on WhatsApp), press pause. Ask: Is this a trap? Do I need to eat this bait? Write it in your journal and decide to let it go before you sleep. Don't go to sleep with a wall in your heart.",prayerAF:"Here Jesus, vandag sien ek dat aanstoot 'n strik is. Ek wil nie vasgevang lewe nie. Help my om stadig te wees om kwaad te word en gou om te vergewe. Leer my om mense vry te spreek soos U my vrygespreek het. Amen.",prayerEN:"Lord Jesus, today I see that offence is a trap. I don't want to live trapped. Help me to be slow to anger and quick to forgive. Teach me to release people like You released me. Amen.",questionsAF:["Wanneer laas het jy 'n muur gebou omdat iemand jou seergemaak het? Wat het gebeur?","Wat is die verskil tussen 'ek voel seer' en 'ek kies om aanstoot te hou'?","Watter een van die ekstra verse praat die meeste met jou hierdie week? Hoekom?"],questionsEN:["When last did you build a wall because someone hurt you? What happened?","What is the difference between 'I feel hurt' and 'I choose to hold offence'?","Which of the extra verses speaks to you most this week? Why?"]},{id:"week-2",number:2,titleAF:"Hoekom is aanstoot 'n strik?",titleEN:"Why is offence a trap?",keyRefAF:"Lukas 17:1",keyRefEN:"Luke 17:1",keyLinkAF:"https://www.bible.com/bible/5/LUK.17.1.AFR53",keyLinkEN:"https://www.bible.com/bible/111/LUK.17.1.NIV",keyTextAF:"En Hy het vir sy dissipels gesê: Dit is onvermydelik dat daar struikelblokke kom, maar wee hom deur wie hulle kom.",keyTextEN:"Jesus said to his disciples: 'Things that cause people to stumble are bound to come, but woe to anyone through whom they come.'",storyAF:"Jesus sê self: aanstoot SAL kom. Dit is soos reën in die Kaap in die winter - jy kan nie keer dat dit kom nie, maar jy kan kies of jy 'n sambreel vat of natreën. As jy elke keer natreën en siek word, is dit nie die reën se skuld nie, dis omdat jy nie skuiling gekies het nie. Aanstoot skei vriende, breek families en verdeel kerke.",storyEN:"Jesus Himself says: offences WILL come. It's like rain in Cape Town in winter - you can't stop it coming, but you can choose whether to take an umbrella or get soaked. If you get soaked and sick every time, it's not the rain's fault, it's because you didn't choose shelter. Offence separates friends, breaks families and divides churches.",meaningAF:"Hoekom is dit 'n strik? 1) Dit maak jou trots - jy voel jy is reg en die ander is verkeerd. 2) Dit maak jou bitter - jy drink gif en hoop die ander een vrek. 3) Dit maak jou alleen - jy bou daardie stad met grendels van Spreuke 18:19. In die laaste dae sê Matt 24:10-12 sal baie mense aanstoot neem, mekaar haat en liefde sal koud word. Ons leef nou daarin.",meaningEN:"Why is it a trap? 1) It makes you proud - you feel you're right and the other is wrong. 2) It makes you bitter - you drink poison hoping the other dies. 3) It makes you isolated - you build that city with barred gates from Proverbs 18:19. In the last days Matt 24:10-12 says many will be offended, hate each other and love will grow cold. We live in that time now.",extras:[{refAF:"2 Timoteus 3:2-3",refEN:"2 Timothy 3:2-3",linkAF:"https://www.bible.com/bible/5/2TI.3.2-3.AFR53",linkEN:"https://www.bible.com/bible/111/2TI.3.2-3.NIV",noteAF:"Mense sal selfsugtig wees, ondankbaar, sonder liefde, onversoenlik...",noteEN:"People will be lovers of themselves, ungrateful, without love, unforgiving..."},{refAF:"Matteus 24:10-12",refEN:"Matthew 24:10-12",linkAF:"https://www.bible.com/bible/5/MAT.24.10-12.AFR53",linkEN:"https://www.bible.com/bible/111/MAT.24.10-12.NIV",noteAF:"Dan sal baie tot struikel gebring word en mekaar haat. Die liefde van baie sal verkoel.",noteEN:"At that time many will turn away from the faith and will betray and hate each other. The love of most will grow cold."},{refAF:"1 Korintiërs 13:5",refEN:"1 Corinthians 13:5",linkAF:"https://www.bible.com/bible/5/1CO.13.5.AFR53",linkEN:"https://www.bible.com/bible/111/1CO.13.5.NIV",noteAF:"Liefde handel nie onwelvoeglik nie, soek nie sy eie belang nie, word nie verbitterd nie, reken die kwaad nie toe nie.",noteEN:"Love does not dishonor others, it is not self-seeking, it is not easily angered, it keeps no record of wrongs."}],practicalAF:"Maak 'n lys: Wie het jou seergemaak en jy hou nog vas? Bid elke dag vir een persoon op daardie lys - nie dat God hulle moet verander nie, maar dat God jou hart sag maak. Dit breek die strik.",practicalEN:"Make a list: Who hurt you and you still hold it? Pray every day for one person on that list - not that God must change them, but that God softens your heart. That breaks the trap.",prayerAF:"Vader, ek erken ek het aanstoot vasgehou. Dit het my trots en bitter gemaak. Vandag kies ek liefde bo my reg. Genees my hart waar dit koud geword het. Amen.",prayerEN:"Father, I admit I have held onto offence. It made me proud and bitter. Today I choose love above being right. Heal my heart where it has grown cold. Amen.",questionsAF:["Hoe het aanstoot jou al alleen laat voel?","Watter van die 3 strikke - trots, bitterheid, isolasie - sien jy die meeste in jou eie lewe?","Lees 1 Kor 13:5 weer. Watter deel is die moeilikste vir jou om te leef?"],questionsEN:["How has offence made you feel isolated before?","Which of the 3 traps - pride, bitterness, isolation - do you see most in your own life?","Read 1 Cor 13:5 again. Which part is hardest for you to live?"]},{id:"week-3",number:3,titleAF:"Paulus en Barnabas - toe vriende stry",titleEN:"Paul & Barnabas - when friends clash",keyRefAF:"Handelinge 15:36-41",keyRefEN:"Acts 15:36-41",keyLinkAF:"https://www.bible.com/bible/5/ACT.15.36-41.AFR53",keyLinkEN:"https://www.bible.com/bible/111/ACT.15.36-41.NIV",keyTextAF:"En daar het 'n skerp meningsverskil ontstaan, sodat hulle van mekaar geskei het; en Barnabas het Markus saamgeneem en na Ciprus gevaar; maar Paulus het Silas gekies...",keyTextEN:"They had such a sharp disagreement that they parted company. Barnabas took Mark and sailed for Cyprus, but Paul chose Silas...",storyAF:"Hierdie is KRITIEK. Paulus en Barnabas was beste vriende, spanmaats. Barnabas was die een wat Paulus gehelp het toe niemand hom vertrou het nie. Hulle het saam kerk geplant. Toe kom die stry: moet ons vir Johannes Markus weer saamvat? Markus het hulle vroeër gelos (Hand 13:13). Paulus sê: Nee, hy is onbetroubaar. Barnabas sê: Gee hom nog 'n kans - hy is my neef en ons moet genadig wees. Hulle kon nie saamstem nie. Die Grieks sê 'paroxusmos' - 'n skerp, hewige uitbarsting. Hulle het geskei. Twee paaie. Seer. Teleurstelling. En tog...",storyEN:"This is CRITICAL. Paul and Barnabas were best friends, teammates. Barnabas was the one who helped Paul when nobody trusted him. They planted churches together. Then came the clash: should we take John Mark again? Mark had left them earlier (Acts 13:13). Paul says: No, he's unreliable. Barnabas says: Give him another chance - he is my cousin and we must be gracious. They could not agree. The Greek says 'paroxusmos' - a sharp, violent outburst. They separated. Two roads. Hurt. Disappointment. And yet...",meaningAF:"Wat beteken dit vir ons? Selfs geestelike, volwasse gelowiges stry. Aanstoot kom selfs in die bediening. Paulus was gefokus op die missie, Barnabas op die mens. Albei het 'n punt gehad. God het nie die stry weggesteek in die Bybel nie - Hy wys dat Hy steeds albei gebruik het. Daar was nie een groot slegte ou nie. Maar kyk wat belangrik is: Hulle het nie mekaar op sosiale media sleg gemaak nie. Hulle het nie bitter gebly nie. Jare later skryf Paulus in 2 Timoteus 4:11: 'Haal Markus en bring hom saam, want hy is vir my nuttig vir die diens.' Wow! Versoening het gebeur. Paulus het gegroei. Markus het gegroei. Barnabas se genade het gewerk.",meaningEN:"What does it mean for us? Even spiritual, mature believers clash. Offence comes even in ministry. Paul was focused on the mission, Barnabas on the man. Both had a point. God didn't hide the fight in the Bible - He shows He still used both. There wasn't one big bad guy. But see what matters: They didn't trash each other on social media. They didn't stay bitter. Years later Paul writes in 2 Timothy 4:11: 'Get Mark and bring him with you, because he is helpful to me in my ministry.' Wow! Reconciliation happened. Paul grew. Mark grew. Barnabas' grace worked.",extras:[{refAF:"Efesiërs 4:26-27",refEN:"Ephesians 4:26-27",linkAF:"https://www.bible.com/bible/5/EPH.4.26-27.AFR53",linkEN:"https://www.bible.com/bible/111/EPH.4.26-27.NIV",noteAF:"Word toornig en sondig nie; laat die son nie ondergaan oor julle toorn nie; en gee aan die duiwel geen plek nie.",noteEN:"In your anger do not sin: Do not let the sun go down while you are still angry, and do not give the devil a foothold."},{refAF:"Kolossense 3:13",refEN:"Colossians 3:13",linkAF:"https://www.bible.com/bible/5/COL.3.13.AFR53",linkEN:"https://www.bible.com/bible/111/COL.3.13.NIV",noteAF:"Verdra mekaar en vergewe mekaar as die een teen die ander 'n klag het.",noteEN:"Bear with each other and forgive one another if any of you has a grievance."},{refAF:"Spreuke 15:1",refEN:"Proverbs 15:1",linkAF:"https://www.bible.com/bible/5/PRO.15.1.AFR53",linkEN:"https://www.bible.com/bible/111/PRO.15.1.NIV",noteAF:"’n Sagte antwoord keer die grimmigheid af, maar ’n krenkende woord laat die toorn opkom.",noteEN:"A gentle answer turns away wrath, but a harsh word stirs up anger."},{refAF:"2 Timoteus 4:11",refEN:"2 Timothy 4:11",linkAF:"https://www.bible.com/bible/5/2TI.4.11.AFR53",linkEN:"https://www.bible.com/bible/111/2TI.4.11.NIV",noteAF:"Bewys van versoening - Paulus vra weer vir Markus. God herstel verhoudings.",noteEN:"Proof of reconciliation - Paul asks for Mark again. God restores relationships."}],practicalAF:"Het jy 'n vriend soos Markus afgeskryf? Of het jy soos Paulus en Barnabas uitmekaar gegaan? Hierdie week: stuur daardie boodskap. Nie om te sê 'jy was verkeerd' nie, maar 'ek waardeer jou nog'. As jy nie kan praat nie, bid vir hulle herstel soos Paulus later gedoen het.",practicalEN:"Did you write off a friend like Mark? Or split like Paul and Barnabas? This week: send that message. Not to say 'you were wrong', but 'I still value you'. If you can't talk, pray for their restoration like Paul later did.",prayerAF:"Here, dankie dat U selfs stryery in die Bybel wys. Help my om nie mense permanent af te skryf nie. Gee my Barnabas se oë om genade te sien, en Paulus se moed om te groei en weer te vertrou. Herstel wat gebreek is. Amen.",prayerEN:"Lord, thank You that You even show fights in the Bible. Help me not to permanently write people off. Give me Barnabas' eyes to see grace, and Paul's courage to grow and trust again. Restore what was broken. Amen.",questionsAF:["Hoekom dink jy het God hierdie pynlike stryery in Handelinge gelos en nie uitgevee nie?","Is jy meer soos Paulus (taak-gefokus) of Barnabas (mens-gefokus) as jy seergemaak word?","Wie is jou 'Markus' wat jy dalk weer moet vertrou? Wat leer 2 Tim 4:11 jou?"],questionsEN:["Why do you think God left this painful fight in Acts and didn't delete it?","Are you more like Paul (task-focused) or Barnabas (people-focused) when hurt?","Who is your 'Mark' you may need to trust again? What does 2 Tim 4:11 teach you?"],specialAF:"Let op: Hulle het versoen. 2 Tim 4:11 bewys dit. Aanstoot hoef nie die einde te wees nie.",specialEN:"Note: They reconciled. 2 Tim 4:11 proves it. Offence does not have to be the end."},{id:"week-4",number:4,titleAF:"Hoe hanteer ons aanstoot?",titleEN:"How do we handle offence?",keyRefAF:"Matteus 18:15",keyRefEN:"Matthew 18:15",keyLinkAF:"https://www.bible.com/bible/5/MAT.18.15.AFR53",keyLinkEN:"https://www.bible.com/bible/111/MAT.18.15.NIV",keyTextAF:"En as jou broeder teen jou sondig, gaan bestraf hom tussen jou en hom alleen. As hy na jou luister, dan het jy jou broeder gewin.",keyTextEN:"If your brother or sister sins, go and point out their fault, just between the two of you. If they listen to you, you have won them over.",storyAF:"Meeste van ons doen Matteus 18 agterstevoor. Ons gaan EERS na almal anders toe: 'Het jy gehoor wat sy gedoen het?' Ons maak 'n WhatsApp-groep sonder die persoon. Jesus sê: Gaan ALLEEN. Privaat. Nie om te wen nie, maar om jou broer te WEN. Dis soos wanneer jou foon se screen gebreek is - jy gaan na die tegniese diens, nie jy skree op Instagram dat jou foon sleg is nie. Herstel gebeur privaat.",storyEN:"Most of us do Matthew 18 backwards. We go FIRST to everyone else: 'Did you hear what she did?' We make a WhatsApp group without the person. Jesus says: Go ALONE. Private. Not to win the argument, but to WIN your brother. It's like when your phone screen is cracked - you go to tech support, you don't scream on Instagram that your phone is bad. Restoration happens privately.",meaningAF:"Jesus gee 3 stappe: 1) Gaan privaat - moenie skinder nie. 2) Praat waarheid in liefde (Ef 4:15) - nie 'jy is altyd...' maar 'ek het seergekry toe...'. 3) Luister. Doel is nie wraak nie, maar herstel. Matteus 5:23-24 sê as jy onthou jou broer het iets teen JOU, gaan maak eers reg voor jy offer. God wil hê verhouding is belangriker as godsdiens. Jakobus 5:16: Bely mekaar julle misdade en bid vir mekaar, sodat julle gesond kan word.",meaningEN:"Jesus gives 3 steps: 1) Go private - don't gossip. 2) Speak truth in love (Eph 4:15) - not 'you always...' but 'I felt hurt when...'. 3) Listen. Goal is not revenge, but restoration. Matthew 5:23-24 says if you remember your brother has something against YOU, go make it right before you offer. God wants relationship more important than religion. James 5:16: Confess your sins to each other and pray for each other so that you may be healed.",extras:[{refAF:"Matteus 5:23-24",refEN:"Matthew 5:23-24",linkAF:"https://www.bible.com/bible/5/MAT.5.23-24.AFR53",linkEN:"https://www.bible.com/bible/111/MAT.5.23-24.NIV",noteAF:"As jy jou gawe bring en onthou jou broer het iets teen jou, gaan versoen eers.",noteEN:"If you are offering your gift and remember your brother has something against you, go be reconciled first."},{refAF:"Jakobus 5:16",refEN:"James 5:16",linkAF:"https://www.bible.com/bible/5/JAS.5.16.AFR53",linkEN:"https://www.bible.com/bible/111/JAS.5.16.NIV",noteAF:"Bely mekaar julle oortredings en bid vir mekaar, sodat julle gesond kan word.",noteEN:"Confess your sins to each other and pray for each other so that you may be healed."},{refAF:"Efesiërs 4:15",refEN:"Ephesians 4:15",linkAF:"https://www.bible.com/bible/5/EPH.4.15.AFR53",linkEN:"https://www.bible.com/bible/111/EPH.4.15.NIV",noteAF:"Maar terwyl ons in liefde die waarheid betrag, sal ons in alles opgroei.",noteEN:"Instead, speaking the truth in love, we will grow to become in every respect the mature body."}],practicalAF:"Oefening: Skryf jou 'Matteus 18-gesprek' neer. Begin met: 'Toe jy ____ gedoen het, het ek ____ gevoel, want ek het gedink ____. Ek waardeer jou en wil ons verhouding herstel.' Moenie WhatsApp as jy kwaad is nie. Wag 24 uur, bid, gaan dan privaat.",practicalEN:"Exercise: Write your 'Matthew 18 conversation'. Start with: 'When you did ___, I felt ___, because I thought ___. I value you and want to restore us.' Don't WhatsApp when angry. Wait 24 hours, pray, then go private.",prayerAF:"Jesus, gee my moed om nie te skinder nie maar om te gaan. Gee my woorde wat waarheid én liefde is. Help my om te luister, nie net my saak te stel nie. Ek wil my broer/suster wen, nie die argument wen nie. Amen.",prayerEN:"Jesus, give me courage not to gossip but to go. Give me words that are both truth AND love. Help me to listen, not just state my case. I want to win my brother/sister, not win the argument. Amen.",questionsAF:["Hoekom is dit so maklik om met ander te praat oor die persoon wat jou seergemaak het, eerder as met die persoon self?","Wat beteken 'waarheid in liefde praat' prakties in jou taal met vriende?","Is daar iemand waarvoor jy eers moet gaan versoen volgens Mat 5:23-24 voordat jy Sondag kerk toe gaan?"],questionsEN:["Why is it so easy to talk to others about the person who hurt you, instead of to the person?","What does 'speaking truth in love' look like practically in your language with friends?","Is there someone you need to go reconcile with according to Matt 5:23-24 before going to church Sunday?"]},{id:"week-5",number:5,titleAF:"Vergifnis maak jou vry",titleEN:"Forgiveness sets you free",keyRefAF:"Matteus 6:14-15",keyRefEN:"Matthew 6:14-15",keyLinkAF:"https://www.bible.com/bible/5/MAT.6.14-15.AFR53",keyLinkEN:"https://www.bible.com/bible/111/MAT.6.14-15.NIV",keyTextAF:"Want as julle die mense hulle oortredinge vergewe, sal julle hemelse Vader julle ook vergewe. Maar as julle die mense hulle oortredinge nie vergewe nie, sal julle Vader julle oortredinge ook nie vergewe nie.",keyTextEN:"For if you forgive other people when they sin against you, your heavenly Father will also forgive you. But if you do not forgive others their sins, your Father will not forgive your sins.",storyAF:"Vergifnis is nie 'n gevoel nie, dit is 'n besluit om 'n gevangene vry te laat - en jy besef jy was die gevangene. Dink aan iemand wat jou R5000 skuld. Elke dag dink jy daaraan. Jy kan nie slaap nie. Vergifnis is om te sê: 'Ek kanselleer jou skuld. Jy hoef my nie meer terug te betaal nie.' Beteken dit die seer was reg? Nee. Beteken dit jy vertrou hulle weer dadelik met jou geld? Nee. Dit beteken jy is nie meer gebind aan daardie skuld nie.",storyEN:"Forgiveness is not a feeling, it is a decision to release a prisoner - and you realize you were the prisoner. Think of someone who owes you $5000. Every day you think about it. You can't sleep. Forgiveness is saying: 'I cancel your debt. You don't have to pay me back.' Does it mean the hurt was okay? No. Does it mean you immediately trust them with your money again? No. It means you are no longer bound to that debt.",meaningAF:"Daar is 3 vlakke: 1) Vergifnis - jy kanselleer die skuld voor God. 2) Genesing - God genees jou hart se wond (dit vat tyd). 3) Vertroue - dit word weer gebou, stadig. Jesus se voorbeeld: 1 Petrus 2:23 - Toe Hy uitgeskel is, het Hy nie teruggeskel nie; toe Hy gely het, nie gedreig nie, maar dit oorgegee aan Hom wat regverdig oordeel. Hy het nie gevoelens ontken nie, Hy het dit aan die Vader oorgegee. Markus 11:25 sê staan en bid - vergewe, sodat jou Vader jou kan vergewe. Dis 'n hart-ketting wat breek.",meaningEN:"There are 3 levels: 1) Forgiveness - you cancel the debt before God. 2) Healing - God heals your heart's wound (it takes time). 3) Trust - it is rebuilt slowly. Jesus' example: 1 Peter 2:23 - When they hurled insults at Him, He did not retaliate; when He suffered, He made no threats, but entrusted Himself to Him who judges justly. He didn't deny feelings, He handed them to the Father. Mark 11:25 says stand and pray - forgive, so your Father can forgive you. It's a heart-chain that breaks.",extras:[{refAF:"Efesiërs 4:31-32",refEN:"Ephesians 4:31-32",linkAF:"https://www.bible.com/bible/5/EPH.4.31-32.AFR53",linkEN:"https://www.bible.com/bible/111/EPH.4.31-32.NIV",noteAF:"Laat alle bitterheid, woede, toorn wegneem word. Wees goedgesind, vergewe mekaar soos God julle in Christus vergewe het.",noteEN:"Get rid of all bitterness, rage and anger. Be kind, forgiving each other, just as in Christ God forgave you."},{refAF:"Kolossense 3:13",refEN:"Colossians 3:13",linkAF:"https://www.bible.com/bible/5/COL.3.13.AFR53",linkEN:"https://www.bible.com/bible/111/COL.3.13.NIV",noteAF:"Soos Christus julle vergewe het, so moet julle ook vergewe.",noteEN:"Forgive as the Lord forgave you."},{refAF:"Markus 11:25",refEN:"Mark 11:25",linkAF:"https://www.bible.com/bible/5/MRK.11.25.AFR53",linkEN:"https://www.bible.com/bible/111/MRK.11.25.NIV",noteAF:"En wanneer julle staan en bid, vergeef as julle iets teen iemand het.",noteEN:"And when you stand praying, if you hold anything against anyone, forgive them."},{refAF:"1 Petrus 2:23",refEN:"1 Peter 2:23",linkAF:"https://www.bible.com/bible/5/1PE.2.23.AFR53",linkEN:"https://www.bible.com/bible/111/1PE.2.23.NIV",noteAF:"Jesus het nie teruggeskel nie - Hy het dit oorgegee aan die Vader.",noteEN:"Jesus did not retaliate - He entrusted Himself to the Father."}],practicalAF:"Doen dit vandag: Vat 'n papier. Skryf bo-aan: 'Ek kies om te vergewe'. Skryf die name. Bid hardop: 'Vader, ek vergewe (naam) vir (wat hulle gedoen het). Ek kanselleer hulle skuld. Seën hulle.' Skeur dan die papier as teken jy los. Jy mag dalk weer seer voel môre - vergewe weer. 70x7 keer.",practicalEN:"Do this today: Take a paper. Write at top: 'I choose to forgive'. Write the names. Pray out loud: 'Father, I forgive (name) for (what they did). I cancel their debt. Bless them.' Then tear the paper as a sign you release. You may feel hurt again tomorrow - forgive again. 70x7 times.",prayerAF:"Vader, ek vergewe soos U my vergewe het. Dit is moeilik, maar ek kies dit. Ek gee my seer vir U soos Jesus gedoen het. Genees my hart. Was bitterheid uit my. Ek wil vry wees. Amen.",prayerEN:"Father, I forgive as You forgave me. It's hard, but I choose it. I give my hurt to You as Jesus did. Heal my heart. Wash bitterness out of me. I want to be free. Amen.",questionsAF:["Wat is die verskil tussen vergifnis en vertroue? Hoekom is dit belangrik?","Hoekom dink jy sê Jesus in Mat 6 dat as ons nie vergewe nie, God ons nie vergewe nie?","Watter naam moet jy vandag op daardie papier skryf?"],questionsEN:["What is the difference between forgiveness and trust? Why is it important?","Why do you think Jesus says in Matt 6 that if we don't forgive, God won't forgive us?","What name do you need to write on that paper today?"]},{id:"week-6",number:6,titleAF:"Lewe sonder aanstoot",titleEN:"Living unoffended",keyRefAF:"Psalm 119:165",keyRefEN:"Psalm 119:165",keyLinkAF:"https://www.bible.com/bible/5/PSA.119.165.AFR53",keyLinkEN:"https://www.bible.com/bible/111/PSA.119.165.NIV",keyTextAF:"Groot vrede het die wat u wet liefhet, en vir hulle is daar geen struikelblok nie.",keyTextEN:"Great peace have those who love your law, and nothing can make them stumble.",storyAF:"Hierdie vers is jou superkrag. As jy God se Woord meer liefhet as jou reg om seergemaak te wees, het jy GROOT VREDE. Niks kan jou laat struikel nie. Dink aan 'n diep rivier: klein klippies maak geen golwe nie. 'n Vlak plas maak baie gespat. As jou hart diep is in die Woord, maak klein aanstootjies jou nie omver nie. Jy word onaanstootlik - nie omdat mense ophou seermaak nie, maar omdat jou vrede groter is as hulle fout.",storyEN:"This verse is your superpower. If you love God's Word more than your right to be offended, you have GREAT PEACE. Nothing can make you stumble. Think of a deep river: small pebbles make no waves. A shallow puddle splashes a lot. If your heart is deep in the Word, small offences don't knock you over. You become unoffendable - not because people stop hurting, but because your peace is bigger than their failure.",meaningAF:"Hoe leef ons onaanstootlik? 1) Vul jou hart daagliks met Woord - Fil 4:8 sê dink aan wat waar, eerbaar, regverdig, rein, lieflik is. 2) Onthou Johannes 16:33 - in die wêreld sal julle verdrukking hê, maar wees goeie moed, Ek het die wêreld oorwin. Aanstoot sal kom, maar Jesus het reeds gewen. 3) Romeine 12:18-19 - So ver as dit van julle afhang, leef in vrede met alle mense. Moenie julle wreek nie. Gee plek vir die toorn van God. Jy hoef nie regter te speel nie. God sien.",meaningEN:"How do we live unoffended? 1) Fill your heart daily with Word - Phil 4:8 says think about what is true, noble, right, pure, lovely. 2) Remember John 16:33 - in this world you will have trouble, but take heart, I have overcome the world. Offence will come, but Jesus already won. 3) Romans 12:18-19 - As far as it depends on you, live at peace with everyone. Do not take revenge. Leave room for God's wrath. You don't have to play judge. God sees.",extras:[{refAF:"Spreuke 12:16",refEN:"Proverbs 12:16",linkAF:"https://www.bible.com/bible/5/PRO.12.16.AFR53",linkEN:"https://www.bible.com/bible/111/PRO.12.16.NIV",noteAF:"Die dwaas se toorn word die selfde dag bekend, maar die skrandere bedek die smaad.",noteEN:"Fools show their annoyance at once, but the prudent overlook an insult."},{refAF:"Filippense 4:8",refEN:"Philippians 4:8",linkAF:"https://www.bible.com/bible/5/PHI.4.8.AFR53",linkEN:"https://www.bible.com/bible/111/PHI.4.8.NIV",noteAF:"Wat waar is, wat eerbaar is, wat regverdig is... bedink dit.",noteEN:"Whatever is true, noble, right... think about such things."},{refAF:"Johannes 16:33",refEN:"John 16:33",linkAF:"https://www.bible.com/bible/5/JHN.16.33.AFR53",linkEN:"https://www.bible.com/bible/111/JHN.16.33.NIV",noteAF:"In die wêreld sal julle verdrukking hê; maar hou moed, Ek het die wêreld oorwin.",noteEN:"In this world you will have trouble. But take heart! I have overcome the world."},{refAF:"Romeine 12:18-19",refEN:"Romans 12:18-19",linkAF:"https://www.bible.com/bible/5/ROM.12.18-19.AFR53",linkEN:"https://www.bible.com/bible/111/ROM.12.18-19.NIV",noteAF:"Leef in vrede met alle mense. Moenie julle wreek nie, maar gee plek vir die toorn.",noteEN:"Live at peace with everyone. Do not take revenge, but leave room for God's wrath."}],practicalAF:"7-dae uitdaging: Elke oggend lees Psalm 119:165 hardop. Elke aand vra: Het iets my vandag laat struikel? As ja, het ek dit dadelik vergewe? Skryf een goeie ding oor die persoon wat jou seergemaak het (Fil 4:8). Kyk hoe jou vrede groei.",practicalEN:"7-day challenge: Every morning read Psalm 119:165 out loud. Every evening ask: Did something make me stumble today? If yes, did I immediately forgive? Write one good thing about the person who hurt you (Phil 4:8). Watch your peace grow.",prayerAF:"Here, ek wil groot vrede hê. Ek kies om U Woord meer lief te hê as my seer. Maak my hart diep soos 'n rivier. Ek gee wraak vir U. U is my Regter en my Geneesheer. Ek wil lewe sonder aanstoot. Amen.",prayerEN:"Lord, I want great peace. I choose to love Your Word more than my hurt. Make my heart deep like a river. I give revenge to You. You are my Judge and my Healer. I want to live unoffended. Amen.",questionsAF:["Wat beteken 'groot vrede' vir jou in die skool en by die huis?","Watter gedagtes moet jy vervang met Filippense 4:8-gedagtes?","Hoe sal jou lewe lyk as jy 7 dae sonder aanstoot leef? Wat sal verander?"],questionsEN:["What does 'great peace' mean for you at school and at home?","What thoughts do you need to replace with Philippians 4:8 thoughts?","How would your life look if you lived 7 days unoffended? What would change?"],challengeAF:"Volgende 7 dae: Geen aanstoot optel nie. As iemand jou seermaak, vergewe binne 5 minute. Skryf elke aand jou vrede neer van 1-10. Deel volgende week jou storie.",challengeEN:"Next 7 days: Pick up no offence. If someone hurts you, forgive within 5 minutes. Write your peace level 1-10 each evening. Share your story next week."}];function eA(){let[e,t]=lo.useState("AF"),[n,o]=lo.useState("week-1");lo.useEffect(()=>{let l=window.location.hash.replace("#","");if(l&&Dr.some((u)=>u.id===l))o(l),setTimeout(()=>{document.getElementById(l)?.scrollIntoView({behavior:"smooth",block:"start"})},100);let A=()=>{let u=window.location.hash.replace("#","");if(u)o(u)};return window.addEventListener("hashchange",A),()=>window.removeEventListener("hashchange",A)},[]);let r=(l)=>{o(l),history.pushState(null,"",`#${l}`),document.getElementById(l)?.scrollIntoView({behavior:"smooth",block:"start"})},i=(l,A)=>e==="AF"?l:A;return Q("div",{className:"min-h-screen bg-[#FFFBF5] text-zinc-800 antialiased se
