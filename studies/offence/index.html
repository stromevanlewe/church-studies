FFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQB//9k=";var Na=Ut(an(),1),dU=Symbol.for("react.element");var RU=Object.prototype.hasOwnProperty,pU=Na.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,gU={key:!0,ref:!0,__self:!0,__source:!0};function Va(e,t,n){var o,r={},i=null,l=null;n!==void 0&&(i=""+n),t.key!==void 0&&(i=""+t.key),t.ref!==void 0&&(l=t.ref);for(o in t)RU.call(t,o)&&!gU.hasOwnProperty(o)&&(r[o]=t[o]);if(e&&e.defaultProps)for(o in t=e.defaultProps,t)r[o]===void 0&&(r[o]=t[o]);return{$$typeof:dU,type:e,key:i,ref:l,props:r,_owner:pU.current}}var Q=Va,S=Va;var Ta=[{id:1,ref:"PRO.18.19",verseAf:"Spreuke 18:19",verseEn:"Proverbs 18:19",verseTextAf:"’n Broer wat gegrief is, is ontoegankliker as ’n versterkte stad, en twiste is soos die grendels van ’n vesting.",verseTextEn:"A brother wronged is more unyielding than a fortified city; disputes are like the barred gates of a citadel.",titleAf:"Wat is aanstoot?",titleEn:"What is offense?",contentAf:{intro:"Aanstoot gebeur wanneer iemand jou seermaak en jy daardie seer vashou. Dit is nie net ’n gevoel nie — dit word ’n muur tussen jou en ander mense.",points:["Aanstoot begin klein: ’n woord, ’n houding, ’n onregverdige besluit.","As jy dit nie hanteer nie, bou dit ’n muur in jou hart. Jy raak toe vir daardie persoon.","Spreuke sê ’n gegriefde broer is soos ’n versterkte stad — moeilik om weer binne te kom.","Aanstoot gaan nie oor of jy reg is nie. Dit gaan oor wat jy met die seer doen."],reflect:["Wie se woorde of optrede sit nog in jou hart?","Het jy al ’n muur gebou om jouself te beskerm?"],prayer:"Here, wys my waar ek aanstoot vashou. Ek wil nie in ’n tronk van seer bly nie."},contentEn:{intro:"Offense happens when someone hurts you and you hold on to that hurt. It’s not just a feeling — it becomes a wall between you and others.",points:["Offense starts small: a word, an attitude, an unfair decision.","If you don’t deal with it, it builds a wall in your heart. You shut that person out.","Proverbs says an offended brother is like a fortified city — hard to get back into.","Offense is not about whether you are right. It’s about what you do with the hurt."],reflect:["Whose words or actions are still sitting in your heart?","Have you built a wall to protect yourself?"],prayer:"Lord, show me where I am holding offense. I don’t want to live in a prison of hurt."}},{id:2,ref:"LUK.17.1",verseAf:"Lukas 17:1",verseEn:"Luke 17:1",verseTextAf:"Toe sê Hy vir sy dissipels: Dit is onvermydelik dat daar struikelblokke kom, maar wee hom deur wie dit kom.",verseTextEn:"Jesus said to his disciples: Things that cause people to stumble are bound to come, but woe to anyone through whom they come.",titleAf:"Hoekom aanstoot ’n strik is",titleEn:"Why offense is a trap",contentAf:{intro:"Jesus het gesê aanstoot sal verseker kom. Dis nie die vraag óf nie, maar wannéér. Die strik is nie die seer self nie — die strik is om daarin te bly leef.",points:["’n Strik is versteek. Jy sien dit nie totdat jy vasgevang is nie.","Aanstoot steel jou vrede, jou vreugde en jou verhoudings.","Dit maak jou oë toe: jy sien net die ander persoon se fout, nie jou eie hart nie.","Die vyand gebruik aanstoot om kerke, vriendskappe en gesinne te verdeel."],reflect:["Op watter manier het aanstoot jou vrede gesteel die afgelope maand?","Sien jy hoe dit jou verhouding met God beïnvloed?"],prayer:"Jesus, U het geweet strikke kom. Help my om nie daarin te trap nie, maar vry te bly."},contentEn:{intro:"Jesus said offense will certainly come. The question is not if, but when. The trap is not the hurt itself — the trap is staying in it.",points:["A trap is hidden. You don’t see it until you are caught.","Offense steals your peace, your joy, and your relationships.","It blinds you: you only see the other person’s fault, not your own heart.","The enemy uses offense to divide churches, friendships, and families."],reflect:["How has offense stolen your peace this past month?","Do you see how it affects your relationship with God?"],prayer:"Jesus, You knew traps would come. Help me not to step into them, but to stay free."}},{id:3,ref:"ACT.15.36-41",verseAf:"Handelinge 15:36-41",verseEn:"Acts 15:36-41",verseTextAf:"Toe het daar ’n hewige meningsverskil ontstaan, sodat hulle van mekaar geskei het; en Barnabas het Markus saamgeneem en na Ciprus gevaar.",verseTextEn:"They had such a sharp disagreement that they parted company. Barnabas took Mark and sailed for Cyprus.",titleAf:"Paulus en Barnabas — selfs goeie mense stry",titleEn:"Paul & Barnabas — even good people clash",contentAf:{intro:"Paulus en Barnabas was vriende en spanmaats. Hulle het saam kerke geplant. Toe verskil hulle oor Johannes Markus. Dit het so erg geword dat hulle uitmekaar is.",points:["Hulle was nie slegte mense nie. Hulle was passievol en het verskillend gedink.","Aanstoot het nie hulle roeping gekanselleer nie, maar dit het hulle pad vir ’n tyd verdeel.","God het albei steeds gebruik. Barnabas het Markus herstel — later het Paulus self Markus weer nodig gehad.","Selfs wanneer ons seermaak, bly God se plan groter as ons meningsverskil."],reflect:["Het jy al ’n goeie vriendskap verloor oor ’n meningsverskil?","Kan God albei kante steeds gebruik, selfs ná ’n skeiding?"],prayer:"Vader, help my om mense te sien soos U hulle sien — nie net deur my seer nie. Herstel wat gebreek is."},contentEn:{intro:"Paul and Barnabas were friends and teammates. They planted churches together. Then they disagreed about John Mark. It got so sharp they split up.",points:["They were not bad people. They were passionate and saw things differently.","Offense did not cancel their calling, but it did divide their path for a while.","God still used both. Barnabas restored Mark — later Paul himself needed Mark again.","Even when we hurt each other, God’s plan is bigger than our disagreement."],reflect:["Have you lost a good friendship over a disagreement?","Can God still use both sides, even after a split?"],prayer:"Father, help me see people as You see them — not just through my hurt. Restore what was broken."}},{id:4,ref:"MAT.18.15",verseAf:"Mattheus 18:15",verseEn:"Matthew 18:15",verseTextAf:"As jou broeder teen jou sondig, gaan wys hom tereg waar net jy en hy alleen is. As hy na jou luister, het jy jou broeder gewin.",verseTextEn:"If your brother or sister sins, go and point out their fault, just between the two of you. If they listen to you, you have won them over.",titleAf:"Hoe om aanstoot te hanteer",titleEn:"How to deal with offense",contentAf:{intro:"Jesus gee ’n eenvoudige pad. Moenie eers vir ander mense gaan vertel nie. Gaan praat een-tot-een.",points:["1. Gaan privaat — nie op WhatsApp groepe nie, nie agter sy rug nie.","2. Praat oor wat gebeur het, nie oor wie die persoon is nie. 'Jy het dit gedoen' nie 'Jy is altyd so nie'.","3. Luister regtig. Miskien was daar ’n misverstand.","4. Doel is herstel, nie om te wen nie. Jy wil jou broer of suster wén, nie die argument nie."],reflect:["Is daar iemand met wie jy direk moet praat hierdie week?","Wat hou jou terug om daardie gesprek te hê?"],prayer:"Here, gee my moed om die eerste stap te gee. Help my om met genade en waarheid te praat."},contentEn:{intro:"Jesus gives a simple path. Don’t go tell other people first. Go talk one-to-one.",points:["1. Go privately — not in WhatsApp groups, not behind their back.","2. Talk about what happened, not who the person is. 'You did this' not 'You always are this way'.","3. Really listen. Maybe there was a misunderstanding.","4. The goal is restoration, not winning. You want to win your brother or sister, not the argument."],reflect:["Is there someone you need to talk to directly this week?","What is stopping you from having that conversation?"],prayer:"Lord, give me courage to take the first step. Help me speak with grace and truth."}},{id:5,ref:"MAT.6.14-15",verseAf:"Mattheus 6:14-15",verseEn:"Matthew 6:14-15",verseTextAf:"Want as julle die mense hulle oortredinge vergewe, sal julle hemelse Vader julle ook vergewe. Maar as julle die mense hulle oortredinge nie vergewe nie, sal julle Vader julle oortredinge ook nie vergewe nie.",verseTextEn:"For if you forgive other people when they sin against you, your heavenly Father will also forgive you. But if you do not forgive others their sins, your Father will not forgive your sins.",titleAf:"Vergifnis maak jou vry",titleEn:"Forgiveness releases you",contentAf:{intro:"Vergifnis is nie ’n gevoel nie. Dis ’n besluit. Jy wag nie totdat jy lus voel om te vergewe nie — jy kies om los te laat.",points:["Vergifnis sê nie 'wat jy gedoen het was reg nie'. Dit sê 'ek laat God toe om die Regter te wees'.","As jy nie vergewe nie, bly jy vasgebind aan die persoon wat jou seergemaak het.","Vergifnis is soos om gif te los wat jy vir iemand anders wou gee, maar self drink.","God het jou eerste vergewe. Jy vergewe uit die vergifnis wat jy ontvang het."],reflect:["Wie moet jy vandag vryspreek in jou hart?","Wat sou verander as jy nie meer daardie wrok dra nie?"],prayer:"Vader, soos U my vergewe het, kies ek nou om te vergewe. Ek laat los. Maak my hart vry."},contentEn:{intro:"Forgiveness is not a feeling. It’s a decision. You don’t wait until you feel like forgiving — you choose to let go.",points:["Forgiveness doesn’t say 'what you did was okay'. It says 'I let God be the Judge'.","If you don’t forgive, you stay tied to the person who hurt you.","Unforgiveness is like drinking poison you wanted to give to someone else.","God forgave you first. You forgive from the forgiveness you received."],reflect:["Who do you need to release in your heart today?","What would change if you no longer carried that grudge?"],prayer:"Father, as You forgave me, I now choose to forgive. I let go. Make my heart free."}},{id:6,ref:"PSA.119.165",verseAf:"Psalm 119:165",verseEn:"Psalm 119:165",verseTextAf:"Die wat u wet liefhet, het groot vrede; vir hulle is daar geen struikelblok nie.",verseTextEn:"Great peace have those who love your law, and nothing can make them stumble.",titleAf:"Leef onaanstootlik",titleEn:"Living unoffended",contentAf:{intro:"Jy kan nie keer dat mense jou seermaak nie, maar jy kan leer om nie maklik aanstoot te neem nie. Dis ’n leefstyl, nie net een besluit nie.",points:["Liefde vir God se Woord gee vrede. As jou hart vol Woord is, is daar minder plek vir aanstoot.","Bly nederig: moenie dink jy het altyd reg op jou eie manier nie.","Kies om die beste te glo oor ander mense totdat die teendeel bewys word.","Elke dag: vergewe vinnig, praat sag, hou jou hart oop."],reflect:["Watse gewoonte kan jy bou om minder aanstootlik te leef — meer Woord, meer gebed, vinniger vergewe?","Hoe sou jou huis en gemeente lyk as almal so leef?"],prayer:"Here, leer my om in groot vrede te leef. Laat niks my laat struikel nie. Ek kies vandag ’n onaangestote hart."},contentEn:{intro:"You can’t stop people from hurting you, but you can learn to not be easily offended. It’s a lifestyle, not just one decision.",points:["Love for God’s Word brings peace. When your heart is full of the Word, there is less room for offense.","Stay humble: don’t think you always have a right to your own way.","Choose to believe the best about people until proven otherwise.","Every day: forgive quickly, speak softly, keep your heart open."],reflect:["What habit can you build to live less offended — more Word, more prayer, quicker forgiveness?","How would your home and church look if everyone lived like this?"],prayer:"Lord, teach me to live in great peace. Let nothing make me stumble. Today I choose an unoffended heart."}}];funct
