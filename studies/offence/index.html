book:"Matthew",chapter:"24",verse:"10"},{ref:"Psalm 119:165",textEN:"Great peace have those who love your law; nothing can make them stumble.",textAF:"Hulle wat u wet liefhet, het groot vrede; vir hulle is daar geen struikelblok nie.",book:"Psalms",chapter:"119",verse:"165"}],contentEN:[{heading:"Simple truth",body:["Offence is not just feeling hurt. In the Bible, offence is like a trap. Someone sets bait, you bite, and now you are stuck.","When we are offended, we carry the other person in our heart. We think about them all the time. That prison is not built by them – we build it ourselves."]},{heading:"Why it matters",body:["Offended people stop growing. They filter everything through the hurt: 'He meant it like that. She always does this.'","Jesus said in the last days many will be offended. Not because hurt will be bigger, but because love will grow cold if we keep the offence."]}],contentAF:[{heading:"Eenvoudige waarheid",body:["Aanstoot is nie net seerkry nie. In die Bybel is aanstoot soos 'n strik. Iemand sit aas neer, jy byt, en nou sit jy vas.","Wanneer ons aanstoot neem, dra ons die ander persoon in ons hart. Ons dink heeltyd aan hulle. Daardie tronk word nie deur hulle gebou nie – ons bou dit self."]},{heading:"Hoekom dit saak maak",body:["Mense wat aanstoot neem, hou op groei. Hulle sien alles deur die seer: 'Hy het dit so bedoel. Sy doen altyd so.'","Jesus het gesê in die laaste dae sal baie aanstoot neem. Nie omdat seer groter sal wees nie, maar omdat liefde koud word as ons die aanstoot vashou."]}],reflectEN:["When was the last time I felt offended? What story did I tell myself?","Who am I still carrying in my heart?"],reflectAF:["Wanneer laas het ek aanstoot geneem? Watter storie het ek vir myself vertel?","Wie dra ek nog in my hart rond?"],practiceEN:"This week, when offence comes, pause. Say: 'I see the bait. I will not bite.' Pray for the person.",practiceAF:"Hierdie week, wanneer aanstoot kom, stop. Sê: 'Ek sien die aas. Ek gaan nie byt nie.' Bid vir die persoon."},{id:2,hash:"week-2",icon:S(vr,{className:"w-4 h-4"}),titleEN:"The Heart",titleAF:"Die Hart",subtitleEN:"Offence shows what is already inside.",subtitleAF:"Aanstoot wys wat reeds binne is.",greek:{word:"καρδία",translit:"kardia",meaningEN:"heart – center of thoughts and choices",meaningAF:"hart – middelpunt van gedagtes en keuses"},keyVerse:{ref:"Luke 6:45",textEN:"Out of the abundance of the heart his mouth speaks.",textAF:"Uit die oorvloed van die hart praat sy mond.",book:"Luke",chapter:"6",verse:"45"},extraVerses:[{ref:"Proverbs 4:23",textEN:"Keep your heart with all vigilance, for from it flow the springs of life.",textAF:"Bewaar jou hart meer as alles wat bewaar moet word, want daaruit is die oorspronge van die lewe.",book:"Proverbs",chapter:"4",verse:"23"},{ref:"Hebrews 12:15",textEN:"See to it that no root of bitterness springs up.",textAF:"Pas op dat geen wortel van bitterheid opskiet nie.",book:"Hebrews",chapter:"12",verse:"15"}],contentEN:[{heading:"Root, not fruit",body:["Offence feels like it comes from outside – 'You hurt me.' But the Bible says the root is inside.","If my heart is full of insecurity, I will be easily offended. If my heart is secure in God's love, I can hear hard words without falling apart."]},{heading:"Two soils",body:["Jesus told of seed on rocky soil. It grows fast but has no root. When trouble comes, it falls away – it is offended.","Deep soil is a heart that says: God, search me. What in me is still hungry for people's approval?"]}],contentAF:[{heading:"Wortel, nie vrug nie",body:["Aanstoot voel of dit van buite kom – 'Jy het my seergemaak.' Maar die Bybel sê die wortel is binne.","As my hart vol onsekerheid is, sal ek maklik aanstoot neem. As my hart veilig is in God se liefde, kan ek moeilike woorde hoor sonder om uitmekaar te val."]},{heading:"Twee gronde",body:["Jesus het vertel van saad op klipgrond. Dit groei vinnig maar het geen wortel nie. Wanneer moeilikheid kom, val dit weg – dit neem aanstoot.","Diep grond is 'n hart wat sê: Here, deursoek my. Wat in my soek nog mense se goedkeuring?"]}],reflectEN:["What touches me quickly – disrespect, being ignored, correction? Why?","Where do I look for worth: people or God?"],reflectAF:["Wat raak my vinnig – disrespek, om geïgnoreer te word, teregwysing? Hoekom?","Waar soek ek waarde: by mense of by God?"],practiceEN:"Ask God each morning: 'Show me one place in my heart that needs healing today.' Write it down.",practiceAF:"Vra elke oggend vir God: 'Wys my een plek in my hart wat vandag genesing nodig het.' Skryf dit neer."},{id:3,hash:"week-3",icon:S(gr,{className:"w-4 h-4"}),titleEN:"Forgiveness",titleAF:"Vergifnis",subtitleEN:"Letting go is not saying it was okay.",subtitleAF:"Om te laat gaan beteken nie dit was reg nie.",greek:{word:"ἀφίημι",translit:"aphiēmi",meaningEN:"to release, let go, forgive a debt",meaningAF:"om los te laat, vry te laat, skuld te vergewe"},keyVerse:{ref:"Colossians 3:13",textEN:"Forgive as the Lord forgave you.",textAF:"Vergewe mekaar soos die Here julle vergewe het.",book:"Colossians",chapter:"3",verse:"13"},extraVerses:[{ref:"Matthew 18:21-22",textEN:"Not seven times, but seventy-seven times.",textAF:"Nie tot sewe maal toe nie, maar tot sewentig maal sewe toe.",book:"Matthew",chapter:"18",verse:"22"},{ref:"Ephesians 4:32",textEN:"Be kind to one another, forgiving one another.",textAF:"Wees vriendelik en vol medelye teenoor mekaar; vergewe mekaar.",book:"Ephesians",chapter:"4",verse:"32"}],contentEN:[{heading:"What forgiveness is",body:["Forgiveness is not: 'What you did is fine.' It is: 'I cancel your debt. You don't owe me anymore.'","God did not wait until we said sorry perfectly. He forgave first. We copy Him."]},{heading:"How to forgive daily",body:["1. Name it honestly: 'That hurt me.'","2. Bring it to Jesus: 'I give this person and pain to You.'","3. Bless: Pray good for them. Blessing breaks bitterness."]}],contentAF:[{heading:"Wat vergifnis is",body:["Vergifnis is nie: 'Wat jy gedoen het, is reg nie.' Dit is: 'Ek kanselleer jou skuld. Jy skuld my niks meer nie.'","God het nie gewag tot ons perfek jammer sê nie. Hy het eerste vergewe. Ons maak soos Hy."]},{heading:"Hoe om daagliks te vergewe",body:["1. Noem dit eerlik: 'Dit het my seergemaak.'","2. Bring dit na Jesus: 'Ek gee hierdie persoon en pyn vir U.'","3. Seën: Bid goed vir hulle. Seën breek bitterheid."]}],reflectEN:["Who do I need to release today? What debt am I still collecting?","What lie says 'If I forgive, they win'?"],reflectAF:["Wie moet ek vandag loslaat? Watter skuld vorder ek nog?","Watter leuen sê: 'As ek vergewe, wen hulle'?"],practiceEN:"Write a short forgiveness prayer: Name, pain, choice to release, blessing. Read it aloud.",practiceAF:"Skryf 'n kort vergifnisgebed: Naam, pyn, keuse om los te laat, seën. Lees dit hardop."},{id:4,hash:"week-4",icon:S(yt,{className:"w-4 h-4"}),titleEN:"Humility",titleAF:"Nederigheid",subtitleEN:"Pride holds offence, humility releases it.",subtitleAF:"Trots hou aanstoot vas, nederigheid laat los.",greek:{word:"ταπεινοφροσύνη",translit:"tapeinophrosynē",meaningEN:"lowliness of mind, not thinking higher of self",meaningAF:"nederigheid van denke, om nie hoër van jouself te dink nie"},keyVerse:{ref:"James 4:6",textEN:"God opposes the proud but gives grace to the humble.",textAF:"God weerstaan die hoogmoediges, maar aan die nederiges gee Hy genade.",book:"James",chapter:"4",verse:"6"},extraVerses:[{ref:"Philippians 2:3-4",textEN:"Count others more significant than yourselves.",textAF:"Ag mekaar hoër as julleself.",book:"Philippians",chapter:"2",verse:"3"},{ref:"Proverbs 13:10",textEN:"By insolence comes nothing but strife.",textAF:"Deur hoogmoed kom daar niks as twis nie.",book:"Proverbs",chapter:"13",verse:"10"}],contentEN:[{heading:"Pride's voice",body:["Pride says: 'I deserve better. How could they? I would never do that.'","Humility says: 'I also fail. I need grace. Maybe they are tired, hurt, or blind in this area.'"]},{heading:"Quick check",body:["When I am offended, am I trying to prove I am right, or to keep the relationship right?","Humble people can apologize first. They can listen without defending. That is strength, not weakness."]}],contentAF:[{heading:"Trots se stem",body:["Trots sê: 'Ek verdien beter. Hoe kon hulle? Ek sou dit nooit doen nie.'","Nederigheid sê: 'Ek faal ook. Ek het genade nodig. Miskien is hulle moeg, seer, of blind op hierdie gebied.'"]},{heading:"Vinnige toets",body:["Wanneer ek aanstoot neem, probeer ek bewys ek is reg, of probeer ek die verhouding reg hou?","Nederige mense kan eerste om verskoning vra. Hulle kan luister sonder om te verdedig. Dit is krag, nie swakheid nie."]}],reflectEN:["Where does pride make me keep score?","What would it look like to go low this week?"],reflectAF:["Waar laat trots my telling hou?","Hoe sal dit lyk om hierdie week laag te gaan?"],practiceEN:"Each day, do one 'go low' act: ask forgiveness first, serve unseen, let someone else be right.",practiceAF:"Doen elke dag een 'gaan laag' daad: vra eerste om verskoning, dien ongesiens, laat iemand anders reg wees."},{id:5,hash:"week-5",icon:S(Sr,{className:"w-4 h-4"}),titleEN:"Give No Offence",titleAF:"Gee Geen Aanstoot Nie",subtitleEN:"Do not give what you do not want to receive.",subtitleAF:"Moenie gee wat jy nie wil ontvang nie.",greek:{word:"πρόσκομμα",translit:"proskomma",meaningEN:"stumbling block placed in another's way",meaningAF:"struikelblok wat in 'n ander se pad gesit word"},keyVerse:{ref:"Acts 15:36-41",textEN:"There arose a sharp disagreement, so that they separated from each other. Barnabas took Mark... Paul chose Silas...",textAF:"Toe het daar 'n skerp meningsverskil ontstaan, sodat hulle van mekaar geskei het. Barnabas het Markus saamgeneem... Paulus het Silas gekies...",book:"Acts",chapter:"15",verse:"36"},extraVerses:[{ref:"1 Corinthians 10:32-33",textEN:"Give no offense to Jews or to Greeks or to the church of God.",textAF:"Wees geen struikelblok vir Jode of Grieke of vir die gemeente van God nie.",book:"1 Corinthians",chapter:"10",verse:"32"},{ref:"Romans 14:13",textEN:"Decide never to put a stumbling block in a brother's way.",textAF:"Besluit liewer om geen struikelblok in 'n broer se pad te sit nie.",book:"Romans",chapter:"14",verse:"13"},{ref:"Acts 15:39",textEN:"The disagreement was sharp – Paul & Barnabas parted but both kept preaching.",textAF:"Die meningsverskil was skerp – Paulus en Barnabas het geskei maar altwee het bly preek.",book:"Acts",chapter:"15",verse:"39"}],contentEN:[{heading:"Paul & Barnabas – even good people disagree",body:["Acts 15:36-41 tells us: Paul wanted to visit churches again. Barnabas wanted to take John Mark. Paul said no – Mark had left them before in Pamphylia.","The text says in Greek: 'paroxysmos' – a sharp disagreement. They did not pretend. It hurt. They separated.","This is key: disagreement is not sin. Offence that stays is. Both men kept serving Jesus. Barnabas invested in Mark – and Mark later became useful to Paul (2 Tim 4:11). God used both paths.","Giving no offence does not mean you never say a hard truth. It means you say it with love, not to win, and you do not place a block to make your brother fall."]},{heading:"How to disagree without giving offence",body:["1. Check your heart: Am I calm or still hot? Hot hearts make extra wounds.","2. Speak about what you saw, not who they are: 'When you left early, I felt alone' not 'You are unreliable'.","3. Leave room: Maybe you will walk separate ways for a season like Paul and Barnabas, but keep the door open. No gossip, no taking sides."]}],contentAF:[{heading:"Paulus & Barnabas – selfs goeie mense verskil",body:["Handelinge 15:36-41 vertel: Paulus wou weer die gemeentes besoek. Barnabas wou Johannes Markus saamneem. Paulus sê nee – Markus het hulle vroeër in Pamfilië verlaat.","Die teks sê in Grieks: 'paroxysmos' – 'n skerp meningsverskil. Hulle het nie gemaak of alles reg is nie. Dit was seer. Hulle het van mekaar geskei.","Dit is die sleutel: meningsverskil is nie sonde nie. Aanstoot wat bly, is. Altwee mans het Jesus bly dien. Barnabas het in Markus belê – en Markus het later vir Paulus nuttig geword (2 Tim 4:11). God het albei paaie gebruik.","Om geen aanstoot te gee, beteken nie jy sê nooit 'n moeilike waarheid nie. Dit beteken jy sê dit met liefde, nie om te wen nie, en jy sit nie 'n blok neer om jou broer te laat val nie."]},{heading:"Hoe om te verskil sonder om aanstoot te gee",body:["1. Toets jou hart: Is ek kalm of nog kwaad? Kwaad harte maak ekstra wonde.","2. Praat oor wat jy gesien het, nie wie hulle is nie: 'Toe jy vroeg weg is, het ek alleen gevoel' nie 'Jy is onbetroubaar' nie.","3. Los ruimte: Miskien loop julle vir 'n tyd aparte paaie soos Paulus en Barnabas, maar hou die deur oop. Geen skinder, geen kant kies nie."]}],reflectEN:["Have I given offence by how I said something, even if what I said was true?","Is there a Paul/Barnabas separation in my life that needs blessing, not bitterness?"],reflectAF:["Het ek aanstoot gegee deur hoe ek iets gesê het, al was wat ek gesê het waar?","Is daar 'n Paulus/Barnabas-skeiding in my lewe wat seën nodig het, nie bitterheid nie?"],practiceEN:"Before hard talks this week, pray Romans 14:19: pursue what makes for peace. Send one message to bless someone you disagreed with.",practiceAF:"Voor moeilike gesprekke hierdie week, bid Romeine 14:19: jaag na wat vrede bou. Stuur een boodskap om iemand te seën met wie jy verskil het."},{id:6,hash:"week-6",icon:S(mr,{className:"w-4 h-4"}),titleEN:"Freedom",titleAF:"Vryheid",subtitleEN:"Live free, stay free.",subtitleAF:"Leef vry, bly vry.",greek:{word:"ἐλευθερία",translit:"eleutheria",meaningEN:"freedom to be who God made you",meaningAF:"vryheid om te wees wie God jou gemaak het"},keyVerse:{ref:"John 8:36",textEN:"If the Son sets you free, you will be free indeed.",textAF:"As die Seun julle vrygemaak het, sal julle regtig vry wees.",book:"John",chapter:"8",verse:"36"},extraVerses:[{ref:"Galatians 5:1",textEN:"For freedom Christ has set us free; stand firm.",textAF:"Staan dan vas in die vryheid waarmee Christus ons vrygemaak het.",book:"Galatians",chapter:"5",verse:"1"},{ref:"Proverbs 19:11",textEN:"Good sense makes one slow to anger, and it is his glory to overlook an offense.",textAF:"Die insig van 'n mens maak hom stadig om kwaad te word, en dit is vir hom 'n eer om 'n oortreding te vergewe.",book:"Proverbs",chapter:"19",verse:"11"}],contentEN:[{heading:"A new habit",body:["Freedom from offence is not one big decision. It is small daily choices.","Offence will come again – Jesus said it must come. But you can choose: Will I pick it up? Will I carry it? Or will I let it pass like a bird flying over, not nesting in my hair?"]},{heading:"Blessing future",body:["When you live unoffendable, you become safe. People can be real around you. You laugh easier. You hear God clearer.","You also break a cycle. Families and churches stay stuck when everyone keeps offence. One free person can open the door for many."]}],contentAF:[{heading:"'n Nuwe gewoonte",body:["Vryheid van aanstoot is nie een groot besluit nie. Dit is klein daaglikse keuses.","Aanstoot sal weer kom – Jesus het gesê dit moet kom. Maar jy kan kies: Sal ek dit optel? Sal ek dit dra? Of sal ek dit laat verbygaan soos 'n voël wat oorvlieg, nie nesmaak in my hare nie?"]},{heading:"Toekoms seën",body:["Wanneer jy leef sonder om maklik aanstoot te neem, word jy veilig. Mense kan eg wees rondom jou. Jy lag makliker. Jy hoor God duideliker.","Jy breek ook 'n siklus. Families en kerke bly vasgevang wanneer almal aanstoot vashou. Een vry persoon kan die deur vir baie oopmaak."]}],reflectEN:["What will I do next time offence knocks?","Who could be free because I stayed free?"],reflectAF:["Wat sal ek volgende keer doen wanneer aanstoot klop?","Wie kan vry word omdat ek vry gebly het?"],practiceEN:"Finish with a declaration: 'I will not be offended. I will not give offence. I choose love.' Say it for 7 days.",practiceAF:"Sluit af met '
