ffences are inevitable. Hurt will come, but you don't have to pick up the trap."}],storyTitleAF:"Praktiese storie: Die muur in die kerk",storyTitleEN:"Practical story: The wall at church",storyAF:"Thandi het elke Sondag vroeg gekom om stoele reg te sit. Een Sondag groet sy vir Susan, maar Susan kyk deur haar asof sy onsigbaar is. Thandi voel warm in haar bors. 'Na alles wat ek doen?' Die volgende Sondag sit sy heel agter. Dan slaan sy 'n diens oor. In haar kop bou sy 'n saak: Susan is trots, die leier sien dit nie raak nie, niemand waardeer haar nie. Sy het nie net seergekry nie - sy het 'n muur gebou. Elke baksteen was 'n herinnering. Na drie weke is sy nie meer kwaad vir Susan nie, sy is eensaam en moeg. Dit is die strik. Die duiwel hoef haar nie te keer nie, sy het haarself agter 'n grendel toegesluit. Vryheid sou beteken het om Sondag na Susan te stap en te sê: 'Ek het sleg gevoel toe jy verby my gestap het. Is alles reg?'",storyEN:"Thandi came early every Sunday to set up chairs. One Sunday she greets Susan, but Susan looks right through her. Heat rises in her chest. 'After all I do?' Next Sunday she sits at the back. Then she skips a service. In her head she builds a case: Susan is proud, the leader doesn't notice, no one values her. She didn't just get hurt - she built a wall. Each brick was a replay. After three weeks she's not angry at Susan anymore, she's lonely and tired. That's the trap. The enemy doesn't have to stop her, she locked herself behind bars. Freedom would have been walking up to Susan that Sunday and saying: 'I felt small when you walked past me. Are we okay?'"},{id:2,osis:"HEB.12.15",refAF:"Hebreërs 12:15",refEN:"Hebrews 12:15",titleAF:"Die wortel in jou hart",titleEN:"The root in your heart",texts:{AFR83:"Pas op dat niemand in die genade van God te kort skiet nie, dat geen bitter wortel opskiet en onrus verwek en baie hierdeur besoedel word nie.",AFR53:"En pas op dat niemand die genade van God verwerf nie; dat geen wortel van bitterheid opskiet en onrus verwek en baie hierdeur besoedel word nie.",ESV:"See to it that no one fails to obtain the grace of God; that no 'root of bitterness' springs up and causes trouble, and by it many become defiled;",NIV:"See to it that no one falls short of the grace of God and that no bitter root grows up to cause trouble and defile many."},teachingAF:["Aanstoot wys wat al klaar in jou hart is. Dit plant nie bitterheid nie, dit wys die wortel.","As jy moeg, honger of onveilig is, lyk elke opmerking groter. Moegheid is 'n vergrootglas vir aanstoot.","Genade is die onkruidverdelger. Jy vra: 'Watter genade het ek self nodig gehad?'"],teachingEN:["Offence reveals what's already in your heart. It doesn't plant bitterness, it exposes the root.","When you're tired, hungry or insecure, every comment looks bigger. Tiredness is a magnifying glass for offence.","Grace is the weed killer. You ask: 'What grace have I needed myself?'"],extras:[{refAF:"Spreuke 19:11",refEN:"Proverbs 19:11",osis:"PRO.19.11",paraAF:"Insig maak jou stadig om kwaad te word. Dis 'n eer om 'n oortreding te kan mis kyk, nie omdat dit nie saak maak nie, maar omdat jy groter is as dit.",paraEN:"A person's wisdom yields patience; it is to one's glory to overlook an offence - not because it doesn't matter, but because you are bigger than it."},{refAF:"Jakobus 1:19",refEN:"James 1:19",osis:"JAS.1.19",paraAF:"Wees gou om te luister, stadig om te praat, stadig om kwaad te word. Luister eers jou eie hart.",paraEN:"Be quick to listen, slow to speak, slow to anger. First listen to your own heart."}],storyTitleAF:"Praktiese storie: Moeg en aanstootlik",storyTitleEN:"Practical story: Tired and offendable",storyAF:"Johan het twee nagte sleg geslaap - eksamen, baba wat huil. In die klas sê sy vriend: 'Jy is weer laat.' Normaalweg sou hy lag. Nou ontplof hy: 'Jy dink jy is beter as ek!' Later skaam hy hom. Was sy vriend werklik so lelik? Nee. Johan was leeg. Toe hy leeg is, het sy hart se ou wortel gewys: 'Ek moet bewys ek is goed genoeg.' Aanstoot het nie daardie dag begin nie. Dit het net sigbaar geword. Hy het geleer om te vra: 'Het ek geslaap? Het ek geëet? Het ek by God tyd gemaak?' As hy nee sê, weet hy: moenie nou groot besluite neem nie, kry eers rus en genade.",storyEN:"Johan had two bad nights - exams, baby crying. In class his friend says, 'You're late again.' Normally he'd laugh. Now he snaps: 'You think you're better than me!' Later he's embarrassed. Was his friend really that harsh? No. Johan was empty. When empty, his heart's old root showed: 'I have to prove I'm good enough.' Offence didn't start that day. It just became visible. He learned to ask: 'Did I sleep? Did I eat? Did I spend time with God?' If no, he knows: don't make big decisions now, get rest and grace first."},{id:3,osis:"PRO.18.19",refAF:"Spreuke 18:19",refEN:"Proverbs 18:19",titleAF:"Die versterkte stad - hoekom broers so seer maak",titleEN:"The fortified city - why brothers hurt most",texts:{AFR83:"'n Veronregte broer is ontoegankliker as 'n versterkte stad, en twiste is soos die grendels van 'n vesting.",AFR53:"'n Broer wat veronreg is, is erger as 'n sterk stad, en twiste is soos die grendels van 'n kasteel.",ESV:"A brother offended is more unyielding than a strong city, and quarreling is like the bars of a castle.",NIV:"A brother wronged is more unyielding than a fortified city; disputes are like the barred gates of a citadel."},teachingAF:["Hoe nader die verhouding, hoe dieper die seer. 'n Vreemdeling kan jou nie regtig aanstoot gee nie - net 'n broer.","Na aanstoot bou ons bewyse: Ons versamel stories, WhatsApps, getuies. Die grendels word al hoe dikker.","Versoening voel vir die vlees soos verloor. Vir die gees is dit wen."],teachingEN:["The closer the relationship, the deeper the hurt. A stranger can't really offend you - only a brother can.","After offence we collect evidence: stories, WhatsApps, witnesses. The bars get thicker.","To the flesh, reconciliation feels like losing. To the spirit, it's winning."],extras:[{refAF:"Matteus 5:23-24",refEN:"Matthew 5:23-24",osis:"MAT.5.23-24",paraAF:"As jy jou gawe na die altaar bring en daar onthou jou broer het iets teen jou, los jou gawe en gaan maak eers reg. God wil jou hart hê, nie net jou lied nie.",paraEN:"If you're offering your gift and remember your brother has something against you, leave your gift and go be reconciled first. God wants your heart, not just your song."},{refAF:"Efesiërs 4:26",refEN:"Ephesians 4:26",osis:"EPH.4.26",paraAF:"Word kwaad, maar moenie sondig nie. Moenie dat die son ondergaan oor julle toorn nie. Gee nie plek vir bitterheid oornag nie.",paraEN:"Be angry and do not sin; do not let the sun go down on your anger. Don't give bitterness a place overnight."}],storyTitleAF:"Praktiese storie: Grendels in die kombuis",storyTitleEN:"Practical story: Bars in the kitchen",storyAF:"Twee susters, Lea en Mia, het saam grootgeword. Mia vergeet Lea se verjaardag. Lea sê niks, maar sy begin tel: Mia het my nie gebel nie, sy het my laas gekritiseer, sy dink sy is besig. Elke keer as Mia praat, hoor Lea nie woorde nie, sy hoor grendels. 'Klink' - nog 'n bewys. Na ses maande kan Mia niks reg doen nie. Toe hulle uiteindelik praat, huil Mia: 'Ek was in depressie daardie week, ek het self vergeet watter dag dit is.' Die stad se mure was nie gebou uit daardie een verjaardag nie, maar uit ses maande se onuitgesproke stories. Een eerlike gesprek het meer grendels gebreek as ses maande se stilte.",storyEN:"Two sisters, Lea and Mia, grew up together. Mia forgets Lea's birthday. Lea says nothing, but starts counting: Mia didn't call, she criticized me last time, she thinks she's busy. Every time Mia speaks, Lea doesn't hear words, she hears bars. 'Clink' - another piece of evidence. After six months Mia can do nothing right. When they finally talk, Mia cries: 'I was in depression that week, I forgot what day it was myself.' The city walls weren't built from that one birthday, but from six months of unspoken stories. One honest conversation broke more bars than six months of silence."},{id:4,osis:"PRO.19.11",refAF:"Spreuke 19:11",refEN:"Proverbs 19:11",titleAF:"Moenie die boodskapper skiet nie",titleEN:"Don't shoot the messenger",texts:{AFR83:"'n Mens se insig laat hom lankmoedig wees, en dit is vir hom 'n eer om 'n oortreding te vergewe.",AFR53:"Die verstand van 'n mens maak hom lankmoedig, en dit is sy eer om die oortreding te vergewe.",ESV:"Good sense makes one slow to anger, and it is his glory to overlook an offense.",NIV:"A person's wisdom yields patience; it is to one's glory to overlook an offense."},teachingAF:["Agab het Elia gehaat, nie omdat Elia sleg was nie, maar omdat Elia die waarheid gepraat het. Ons neem aanstoot aan waarheid as dit ons beheer bedreig.","Aanstoot maak van wysheid 'n vyand. Jy skiet die dokter omdat die diagnose seer maak.","Stadig word is nie swak wees nie. Dis krag onder beheer."],teachingEN:["Ahab hated Elijah, not because Elijah was bad, but because Elijah told the truth. We take offence at truth when it threatens our control.","Offence makes wisdom feel like an enemy. You shoot the doctor because the diagnosis hurts.","Being slow to anger is not weak. It's strength under control."],extras:[{refAF:"1 Konings 18:17",refEN:"1 Kings 18:17",osis:"1KI.18.17",paraAF:"Agab sê vir Elia: 'Is dit jy, jy wat Israel in die ongeluk stort?' Hy blameer die boodskapper vir die droogte wat sy eie afgode veroorsaak het.",paraEN:"Ahab says to Elijah: 'Is that you, you troubler of Israel?' He blames the messenger for the drought his own idols caused."},{refAF:"Spreuke 15:1",refEN:"Proverbs 15:1",osis:"PRO.15.1",paraAF:"'n Sagte antwoord keer die grimmigheid af. Jy hoef nie te wen nie, jy kan die vuur blus.",paraEN:"A gentle answer turns away wrath. You don't have to win, you can put out the fire."}],storyTitleAF:"Praktiese storie: Die boodskapper by die werk",storyTitleEN:"Practical story: The messenger at work",storyAF:"In Graad 10 kry Lindi haar wiskunde toets terug: 62%. Sy is kwaad vir Mnr. Jacobs. 'Hy hou nie van my nie.' By die huis skeur sy die vraestel. Haar ma kyk en sê: 'Jy het vraag 4 nie eers probeer nie.' Nou is Lindi kwaad vir haar ma ook. Twee boodskappers geskiet. Eers die aand sien sy: Mnr. Jacobs het langs vraag 4 geskryf: 'Jy kan hierdie doen - kom vra my môre.' Haar ma het dieselfde gesê. Die waarheid was nie 'jy is dom' nie, die waarheid was 'jy het opgehou voordat jy klaar is.' Aanstoot het haar laat dink almal is teen haar, terwyl almal eintlik vir haar was. Toe sy die boodskapper nie meer skiet nie, kon sy die boodskap hoor.",storyEN:"In Grade 10, Lindi gets her math test back: 62%. She's angry at Mr. Jacobs. 'He doesn't like me.' At home she rips the paper. Her mom looks and says: 'You didn't even attempt question 4.' Now Lindi is angry at her mom too. Two messengers shot. That evening she sees: Mr. Jacobs wrote next to question 4: 'You can do this - come ask me tomorrow.' Her mom said the same. The truth wasn't 'you're dumb', the truth was 'you stopped before you finished.' Offence made her think everyone was against her, while everyone was actually for her. When she stopped shooting the messenger, she could hear the message."},{id:5,osis:"ACT.15.39",refAF:"Handelinge 15:39-41",refEN:"Acts 15:39-41",titleAF:"Paulus en Barnabas - verskil sonder gif",titleEN:"Paul & Barnabas - disagreement without poison",texts:{AFR83:"Die meningsverskil het so skerp geword dat hulle uitmekaar is. Barnabas het vir Markus saamgeneem en na Ciprus gevaar, maar Paulus het vir Silas gekies en vertrek, nadat hy deur die broers aan die genade van die Here toevertrou is.",AFR53:"Toe het daar verbittering ontstaan, sodat hulle van mekaar geskei het, en Barnabas het Markus saamgeneem en na Ciprus gevaar; maar Paulus het Silas gekies en vertrek nadat hy deur die broeders aan die genade van God opgedra was.",ESV:"And there arose a sharp disagreement, so that they separated from each other. Barnabas took Mark with him and sailed away to Cyprus, but Paul chose Silas and departed, having been commended by the brothers to the grace of the Lord.",NIV:"They had such a sharp disagreement that they parted company. Barnabas took Mark and sailed for Cyprus, but Paul chose Silas and left, commended by the believers to the grace of the Lord."},teachingAF:["Paulus en Barnabas het hard verskil. Dis nie sonde om te verskil nie. Sonde is om aanstoot se gif by te sit.","Hulle het nie mekaar sleg gemaak nie. Hulle het uitmekaar gegaan, maar albei het die evangelie bly preek.","Volwassenheid is: ons kan verskil oor metode, maar steeds een bly in missie en liefde."],teachingEN:["Paul and Barnabas had a sharp disagreement. It's not sin to disagree. Sin is adding the poison of offence.","They didn't trash each other. They separated, but both kept preaching the gospel.","Maturity is: we can differ on method, but stay one in mission and love."],extras:[{refAF:"2 Timoteus 4:11",refEN:"2 Timothy 4:11",osis:"2TI.4.11",paraAF:"Jare later sê Paulus: 'Bring Markus, hy is vir my nuttig.' Wat 'n herstel. Verskil het nie familie vernietig nie.",paraEN:"Years later Paul says: 'Get Mark, he is useful to me.' What restoration. Disagreement didn't destroy family."},{refAF:"Kolossense 3:13",refEN:"Colossians 3:13",osis:"COL.3.13",paraAF:"Verdra mekaar en vergewe mekaar as die een teen die ander 'n klag het. Soos Christus julle vergewe het, so moet julle ook doen.",paraEN:"Bear with each other and forgive one another if any of you has a grievance. As Christ forgave you, so also forgive."}],storyTitleAF:"Praktiese storie: Die skeiding wat nie 'n egskeiding geword het nie",storyTitleEN:"Practical story: The split that didn't become a divorce",storyAF:"Paulus onthou hoe Markus hulle in Pamfilië gelos het - hy was bang, jonk, onbetroubaar. Barnabas onthou hoe Markus sy neef is, en hoe Jesus mense tweede kanse gee. In Antiogië word die lug dik. Paulus: 'Ons kan hom nie weer vat nie.' Barnabas: 'Ons moet hom vat.' Dis skerp. Lukas gebruik die woord paroxusmos - 'n skerp sny. Hulle gaan uitmekaar. Maar let op: geen roddel, geen brief teen mekaar, geen bitter wortel nie. Barnabas vaar na Ciprus en maak 'n dissipel. Paulus vat Silas en plant kerke. Twee spanne in plaas van een. Tien jaar later, in 'n koue tronk in Rome, skryf Paulus: 'Markus is hier, hy help my.' Die verskil het gebly, maar die aanstoot het nooit wortel geskiet nie. Hulle het die saak geskei, nie die hart nie.",storyEN:"Paul remembers how Mark left them in Pamphylia - scared, young, unreliable. Barnabas remembers Mark is his cousin, and how Jesus gives second chances. In Antioch the air gets thick. Paul: 'We can't take him again.' Barnabas: 'We must take him.' It's sharp. Luke uses the word paroxysmos - a sharp cut. They separate. But notice: no gossip, no letter against each other, no bitter root. Barnabas sails to Cyprus and makes a disciple. Paul takes Silas and plants churches. Two teams instead of one. Ten years later, in a cold prison in Rome, Paul writes: 'Mark is here, he helps me.' The disagreement remained, but offence never took root. They divided the assignment, not the heart."},{id:6,osis:"PSA.119.165",refAF:"Psalm 119:165",refEN:"Psalm 119:165",titleAF:"Onaanstoootlik - voetwasser, nie deurmat nie",titleEN:"Unoffendable - foot-washer, not doormat",texts:{AFR83:"Die wat u wet liefhet, geniet groot vrede; niks laat hulle struikel nie.",AFR53:"Die wat u wet liefhet, het groot vrede, en daar is geen struikelblok vir hulle nie.",ESV:"Great peace have those who love your law; nothing can make them stumble.",NIV:"Great peace have those who love your law, and nothing can make them stumble."},teachingAF:["Onaanstoootlik beteken nie jy voel niks nie. Dit beteken jy besluit: niks sal my uit liefde uitstamp nie.","Voetwasser, nie deurmat nie. Jesus het voete gewas, maar Hy het nie toegelat dat mense Hom manipuleer nie. Hy het grense met genade gehad.","Groot vrede kom nie van groot beheer nie, maar van groot liefde vir God se Woord. Woord-liefde maak jou struikelbestand."],teachingEN:["Unoffendable doesn't mean you feel nothing. It means you decide: nothing will knock me out of love.","Foot-washer, not doormat. Jesus washed feet, but He didn't let people manipulate Him. He had boundaries with grace.","Great peace doesn't come from great control, but from great love for God's Word. Word-love makes you stumble-proof."],extras:[{refAF:"Johannes 13:3-5",refEN:"John 13:3-5",osis:"JHN.13.3-5",paraAF:"Jesus weet alles is in sy hande, toe staan Hy op en was voete. Sekuriteit maak jou sag, nie hard nie.",paraEN:"Jesus knew all things were in His hands, so He got up and washed feet. Security makes you soft, not hard."},{refAF:"Spreuke 4:23",refEN:"Proverbs 4:23",osis:"PRO.4.23",paraAF:"Bewaak jou hart meer as alles wat bewaak moet word, want daaruit is die oorspronge van die lewe.",paraEN:"Above all else, guard your heart, for everything you do flows from it."}],storyTitleAF:"Praktiese storie: Die vrou wat nie meer gestruikel het nie",storyTitleEN:"Practical story: The woman who stopped stumbling",storyAF:"Mara het jare lank alles persoonlik opgeneem. As iemand nie terug skryf nie, dink sy: 'Ek is te veel.' As iemand kritiek gee, dink sy: 'Ek is 'n mislukking.' Sy was 'n deurmat - altyd ja sê, dan kwaad wees dat niemand dankie sê nie. Toe begin sy Psalm 119 elke oggend lees, nie vir inligting nie, vir liefde. Een sin het haar verander: 'Groot vrede het die wat U wet liefhet.' Sy het besef: vrede is nie die afwesigheid van seer nie, dis die teenwoordigheid van Woord. Nou vra sy: 'Is hierdie my werk om te dra?' As nee, sê sy vriendelik nee. As iemand haar seermaak, was sy voete: sy bid, sy seën, sy los. Sy is nie meer 'n deurmat wat almal oor loop nie, sy is 'n voetwasser wat kies om laag te buk, nie omdat sy min werd is nie, maar omdat sy vry is. Niks laat haar meer so maklik struikel nie.",storyEN:"Mara took everything personally for years. If someone didn't text back, she thought: 'I'm too much.' If someone criticized, she thought: 'I'm a failure.' She was a doormat - always saying yes, then angry no one said thank you. Then she started reading Psalm 119 each morning, not for information, for love. One line changed her: 'Great peace have those who love your law.' She realized: peace is not the absence of hurt, it's the presence of the Word. Now she asks: 'Is this mine to carry?' If no, she kindly says no. If someone hurts her, she washes feet: she prays, she blesses, she releases. She's no longer a doormat everyone walks over, she's a foot-washer who chooses to bend low, not because she's worth little, but because she's free. Nothing makes her stumble so easily anymore."}];function ei(){let[e,n]=hn.useState("AF"),[t,r]=hn.useState("AFR83"),[l,o]=hn.useState(1);hn.useEffect(()=>{let c=window.location.hash.match(/week-(\d)/);if(c){let h=parseInt(c[1],10);if(h>=1&&h<=6)o(h)}if(navigator.language.toLowerCase().startsWith("en"))n("EN"),r("ESV")},[]),hn.useEffect(()=>{window.location.hash=`week-${l}`},[l]),hn.useEffect(()=>{if(e==="AF"&&(t==="ESV"||t==="NIV"))r("AFR83");if(e==="EN"&&(t==="AFR83"||t==="AFR53"))r("ESV")},[e]);let u=(i,c)=>e==="AF"?i:c,s=Ll.find((i)=>i.id===l)||Ll[0];return z("div",{className:"min-h-screen bg-[#fdf7ef] text-[#2b2117] selection:bg-[#f3d9b1]",children:[S("style",{children:`
