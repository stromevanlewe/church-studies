e comes from unmet expectations.",theme_af:"Aanstoot kom dikwels van verwagtinge wat nie uitgekom het nie.",verses:[{ref_en:"Proverbs 18:19",ref_af:"Spreuke 18:19",bookCode:"PRO.18.19",text_en:"A brother offended is more unyielding than a strong city.",text_af:"’n Broer wat gegrief is, is ontoegankliker as ’n sterk stad."},{ref_en:"James 1:19",ref_af:"Jakobus 1:19",bookCode:"JAS.1.19",text_en:"Let every person be quick to hear, slow to speak, slow to anger.",text_af:"Elkeen moet gou wees om te hoor, stadig om te praat en stadig om kwaad te word."}],points_en:["We expect people to act like us. When they don't, we feel offended.","Pride says: 'I am right, they are wrong.' Humility says: 'Maybe I don't see everything.'","Tiredness, stress and insecurity make offence come faster.","Offence is not always about the other person. It shows what is already in our heart."],points_af:["Ons verwag mense moet soos ons optree. As hulle nie so optree nie, neem ons aanstoot.","Trots sê: 'Ek is reg, hulle is verkeerd.' Nederigheid sê: 'Miskien sien ek nie alles nie.'","Moegheid, stres en onsekerheid laat aanstoot vinniger kom.","Aanstoot gaan nie altyd oor die ander persoon nie. Dit wys wat klaar in ons hart is."],reflect_en:"What expectation makes you most sensitive? Being ignored? Not being thanked? Being corrected?",reflect_af:"Watter verwagting maak jou die sensitiefste? Om geïgnoreer te word? Om nie dankie te kry nie? Om reggehelp te word?",action_en:"Before you react today, pause and ask: 'What did I expect, and is it fair?'",action_af:"Voordat jy vandag reageer, stop en vra: 'Wat het ek verwag, en is dit regverdig?'"},3:{title_en:"Week 3 — Paul & Barnabas Disagreed",title_af:"Week 3 — Paulus & Barnabas het Verskil",theme_en:"Even good people disagree. Offence does not have to end the mission.",theme_af:"Selfs goeie mense verskil. Aanstoot hoef nie die sending te stop nie.",verses:[{ref_en:"Acts 15:39",ref_af:"Handelinge 15:39",bookCode:"ACT.15.39",text_en:"There arose a sharp disagreement, so that they separated from each other.",text_af:"Die onenigheid was so skerp dat hulle uitmekaar gegaan het."},{ref_en:"2 Timothy 4:11",ref_af:"2 Timoteus 4:11",bookCode:"2TI.4.11",text_en:"Get Mark and bring him with you, for he is very useful to me for ministry.",text_af:"Kry vir Markus en bring hom saam, want hy is vir my van groot nut vir die dienswerk."}],points_en:["Paul and Barnabas were close friends and mission partners.","They disagreed sharply about John Mark. Barnabas wanted to give him a second chance. Paul did not.","The disagreement was so sharp they split and went different ways. That was painful.","But God still used both of them. Later Paul says Mark is useful to him. The relationship was healed.","Disagreement is normal. Taking permanent offence is a choice."],points_af:["Paulus en Barnabas was goeie vriende en het saam sendingwerk gedoen.","Hulle het skerp verskil oor Johannes Markus. Barnabas wou hom ’n tweede kans gee. Paulus nie.","Die verskil was so skerp dat hulle uitmekaar is. Dit was seer.","Maar God het albei nog steeds gebruik. Later sê Paulus Markus is nuttig vir hom. Die verhouding is herstel.","Verskil is normaal. Om permanente aanstoot te hou, is ’n keuse."],story_en:"This story shows us: you can disagree without hating. You can separate for a season without cancelling each other. Maturity is not pretending you agree - it is not letting offence poison your future.",story_af:"Hierdie storie wys ons: jy kan verskil sonder om te haat. Jy kan vir ’n tyd uitmekaar gaan sonder om mekaar af te skryf. Volwassenheid is nie om te maak of jy saamstem nie - dit is om nie aanstoot jou toekoms te laat vergiftig nie.",reflect_en:"Who do you need to see as still useful, even after a disagreement?",reflect_af:"Wie moet jy weer as nuttig sien, selfs na ’n verskil?",action_en:"Pray by name for someone you disagreed with. No long message needed. Just release.",action_af:"Bid by die naam vir iemand met wie jy verskil het. Geen lang boodskap nodig nie. Laat net los."},4:{title_en:"Week 4 — How to Let Go of Offence",title_af:"Week 4 — Hoe om Aanstoot te Laat Los",theme_en:"Forgiveness is a decision, not a feeling.",theme_af:"Vergifnis is ’n besluit, nie ’n gevoel nie.",verses:[{ref_en:"Ephesians 4:26-27",ref_af:"Efesiërs 4:26-27",bookCode:"EPH.4.26-27",text_en:"Do not let the sun go down on your anger, and give no opportunity to the devil.",text_af:"Moenie dat die son ondergaan terwyl julle nog kwaad is nie, en moenie vir die duiwel ’n kans gee nie."},{ref_en:"Colossians 3:13",ref_af:"Kolossense 3:13",bookCode:"COL.3.13",text_en:"Bearing with one another and forgiving one another... as the Lord has forgiven you.",text_af:"Verdra mekaar en vergewe mekaar... soos die Here julle vergewe het."}],points_en:["Step 1: Name it. 'I took offence when...' Don't hide it.","Step 2: Overlook where you can. Proverbs 19:11 says it is glory to overlook.","Step 3: Talk quickly and kindly if you must talk. Use 'I felt' not 'You always'.","Step 4: Forgive as you were forgiven. Forgiveness does not say it was okay. It says: I won't carry it anymore.","If you wait until you feel like forgiving, you will wait forever. Start with a decision."],points_af:["Stap 1: Noem dit. 'Ek het aanstoot geneem toe...' Moenie dit wegsteek nie.","Stap 2: Sien oor waar jy kan. Spreuke 19:11 sê dit is ’n eer om oor te sien.","Stap 3: Praat vinnig en vriendelik as jy moet praat. Gebruik 'Ek het gevoel' nie 'Jy altyd' nie.","Stap 4: Vergewe soos jy vergewe is. Vergifnis sê nie dit was reg nie. Dit sê: ek gaan dit nie meer saamdra nie.","As jy wag tot jy lus voel om te vergewe, gaan jy vir ewig wag. Begin met ’n besluit."],reflect_en:"What do you need to overlook, what do you need to talk about, and what do you need to forgive?",reflect_af:"Wat moet jy oorsien, waaroor moet jy praat, en wat moet jy vergewe?",action_en:"Choose one person and write: I release you from owing me. Then live that way today.",action_af:"Kies een persoon en skryf: Ek on
