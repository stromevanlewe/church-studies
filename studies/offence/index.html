H6a4 4 0 0 0-4 4v2",key:"1yyitq"}],["circle",{cx:"9",cy:"7",r:"4",key:"nufk8"}],["path",{d:"M22 21v-2a4 4 0 0 0-3-3.87",key:"kshegd"}],["path",{d:"M16 3.13a4 4 0 0 1 0 7.75",key:"1da9ce"}]]);var rc=Qe(Et(),1),F0=Symbol.for("react.element"),O0=Symbol.for("react.fragment"),I0=Object.prototype.hasOwnProperty,U0=rc.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,$0={key:!0,ref:!0,__self:!0,__source:!0};function lc(e,t,n){var r,l={},u=null,o=null;n!==void 0&&(u=""+n),t.key!==void 0&&(u=""+t.key),t.ref!==void 0&&(o=t.ref);for(r in t)I0.call(t,r)&&!$0.hasOwnProperty(r)&&(l[r]=t[r]);if(e&&e.defaultProps)for(r in t=e.defaultProps,t)l[r]===void 0&&(l[r]=t[r]);return{$$typeof:F0,type:e,key:u,ref:o,props:l,_owner:U0.current}}var gn=O0,C=lc,x=lc;var _e={ESV:59,NIV:111,AFR83:5,AFR53:2};function Be(e,t,n){return`https://www.bible.com/bible/${e}/${t}.${n}`}var Ve=[{id:"week-1",number:1,title:{en:"The Trap",af:"Die Strik"},subtitle:{en:"What offense really is",af:"Wat aanstoot regtig is"},keyVerse:{refEn:"Proverbs 19:11",refAf:"Spreuke 19:11",book:"PRO",cv:"19.11"},verses:[{refEn:"Luke 17:1",refAf:"Lukas 17:1",book:"LUK",cv:"17.1"},{refEn:"Proverbs 18:19",refAf:"Spreuke 18:19",book:"PRO",cv:"18.19"}],intro:{en:"When someone hurts you, it is easy to hold on to that hurt. The Bible calls this being 'offended'. It is like stepping into a trap. The trap does not hurt the other person - it keeps you stuck.",af:"Wanneer iemand jou seermaak, is dit maklik om aan daardie seer vas te hou. Die Bybel noem dit 'aanstoot neem'. Dit is soos om in 'n strik te trap. Die strik maak nie die ander persoon seer nie - dit hou jou vasgevang."},points:{en:[{h:"Offense is a choice",p:"People will disappoint you. That is normal. Offense is what happens when you decide to keep the hurt and not let it go."},{h:"It builds a wall",p:"Proverbs 18:19 says an offended brother is harder to win back than a strong city. Offense builds a wall between you and others, and between you and God."},{h:"Everyone faces it",p:"Jesus said in Luke 17:1 that offenses will come. You cannot stop hurt from coming, but you can decide not to live in it."}],af:[{h:"Aanstoot is ’n keuse",p:"Mense gaan jou teleurstel. Dit is normaal. Aanstoot gebeur wanneer jy besluit om die seer te hou en nie te laat gaan nie."},{h:"Dit bou ’n muur",p:"Spreuke 18:19 sê ’n broer wat aanstoot geneem het, is moeiliker om terug te wen as ’n sterk stad. Aanstoot bou ’n muur tussen jou en ander, en tussen jou en God."},{h:"Almal kry daarmee te doen",p:"Jesus het in Lukas 17:1 gesê aanstoot sal kom. Jy kan nie keer dat seer kom nie, maar jy kan besluit om nie daarin te bly nie."}]},questions:{en:["Think of a time when you felt offended. What happened and how did you respond?","How does holding on to offense affect your peace and friendships?","What is the difference between feeling hurt and choosing to stay offended?"],af:["Dink aan ’n keer toe jy aanstoot geneem het. Wat het gebeur en hoe het jy gereageer?","Hoe beïnvloed dit jou vrede en vriendskappe as jy aanstoot vashou?","Wat is die verskil tussen seerkry en kies om aanstoot te bly?"]},action:{en:"This week, notice when you feel offended. Instead of reacting quickly, pause and pray: 'God, help me not to pick up this trap.'",af:"Let hierdie week op wanneer jy aanstoot voel. Moenie dadelik reageer nie, maar bid: 'Here, help my om nie hierdie strik op te tel nie.'"},prayer:{en:"Father, show me where I am holding offense. Help me see it as a trap that keeps me stuck. Give me a willing heart to let go.",af:"Vader, wys my waar ek aanstoot vashou. Help my om dit as ’n strik te sien wat my vashou. Gee my ’n gewillige hart om te laat gaan."}},{id:"week-2",number:2,title:{en:"How It Grows",af:"Hoe Dit Groei"},subtitle:{en:"From small hurt to bitter root",af:"Van klein seer tot bitter wortel"},keyVerse:{refEn:"Hebrews 12:15",refAf:"Hebreërs 12:15",book:"HEB",cv:"12.15"},verses:[{refEn:"Ephesians 4:26-27",refAf:"Efesiërs 4:26-27",book:"EPH",cv:"4.26-27"},{refEn:"James 3:6",refAf:"Jakobus 3:6",book:"JAS",cv:"3.6"}],intro:{en:"If you do not deal with a small hurt, it grows. Like a seed that becomes a tree, offense can grow into bitterness that affects everything you say and do.",af:"As jy nie ’n klein seer hanteer nie, groei dit. Soos ’n saad wat ’n boom word, kan aanstoot groei tot bitterheid wat alles wat jy sê en doen beïnvloed."},points:{en:[{h:"It starts small",p:"You replay what they said. You tell the story again and again. Each time, the hurt gets bigger in your mind."},{h:"It spreads",p:"Hebrews 12:15 warns that a bitter root grows up and defiles many. Your bitterness can hurt your friends, family, and church."},{h:"It gives the enemy space",p:"Ephesians 4:26-27 says do not let the sun go down on your anger, and do not give the devil a foothold. Unforgiveness opens a door."}],af:[{h:"Dit begin klein",p:"Jy speel oor en oor af wat hulle gesê het. Jy vertel die storie weer en weer. Elke keer word die seer groter in jou gedagtes."},{h:"Dit versprei",p:"Hebreërs 12:15 waarsku dat ’n bitter wortel opskiet en baie besoedel. Jou bitterheid kan jou vriende, familie en kerk seermaak."},{h:"Dit gee die vyand plek",p:"Efesiërs 4:26-27 sê moet nie die son oor julle toorn laat ondergaan nie, en gee die duiwel geen plek nie. Onvergewensgesindheid maak ’n deur oop."}]},questions:{en:["What stories do you keep repeating in your head about someone who hurt you?","Who else has been affected by your bitterness or negative talk?","What does 'do not let the sun go down on your anger' mean in real life?"],af:["Watter stories speel jy oor en oor in jou kop oor iemand wat jou seergemaak het?","Wie anders is al geraak deur jou bitterheid of negatiewe praatjies?","Wat beteken 'moenie die son oor julle toorn laat ondergaan nie' in die regte lewe?"]},action:{en:"Stop feeding the story. When the thought comes, choose not to retell it. Write down three good things about the person who hurt you.",af:"Hou op om die storie te voed. Wanneer die gedagte kom, kies om dit nie weer te vertel nie. Skryf drie goeie dinge neer oor die persoon wat jou seergemaak het."},prayer:{en:"Lord, I do not want a bitter root in my heart. Pull it out. Help me stop replaying the hurt and start healing.",af:"Here, ek wil nie ’n bitter wortel in my hart hê nie. Trek dit uit. Help my om op te hou om die seer te herhaal en te begin gesond word."}},{id:"week-3",number:3,title:{en:"Letting Go",af:"Laat Los"},subtitle:{en:"What forgiveness really means",af:"Wat vergifnis regtig beteken"},keyVerse:{refEn:"Matthew 18:21-22",refAf:"Mattheus 18:21-22",book:"MAT",cv:"18.21-22"},verses:[{refEn:"Ephesians 4:32",refAf:"Efesiërs 4:32",book:"EPH",cv:"4.32"},{refEn:"Colossians 3:13",refAf:"Kolossense 3:13",book:"COL",cv:"3.13"}],intro:{en:"Forgiveness does not mean what they did was okay. It means you decide to hand the person and the pain over to God. You release them so you can be free.",af:"Vergifnis beteken nie wat hulle gedoen het was reg nie. Dit beteken jy besluit om die persoon en die pyn vir God te gee. Jy laat hulle los sodat jy vry kan wees."},points:{en:[{h:"Forgiveness is a decision, not a feeling",p:"Peter asked how many times to forgive. Jesus said seventy times seven. That means forgiveness is a lifestyle, not a one-time emotion."},{h:"We forgive because we are forgiven",p:"Ephesians 4:32 says forgive as God forgave you. God forgave your big debt, so you can forgive others' smaller debts."},{h:"It sets you free",p:"When you forgive, you are not saying 'you win'. You are saying 'I will not carry this anymore'. The prisoner you set free is you."}],af:[{h:"Vergifnis is ’n besluit, nie ’n gevoel nie",p:"Petrus het gevra hoeveel keer om te vergewe. Jesus het gesê sewentig maal sewe. Dit beteken vergifnis is ’n lewenswyse, nie ’n eenmalige gevoel nie."},{h:"Ons vergewe omdat ons vergewe is",p:"Efesiërs 4:32 sê vergewe soos God julle vergewe het. God het jou groot skuld vergewe, so jy kan ander se kleiner skuld vergewe."},{h:"Dit maak jou vry",p:"Wanneer jy vergewe, sê jy nie 'jy wen' nie. Jy sê 'ek gaan dit nie meer dra nie'. Die gevangene wat jy vrylaat, is jy."}]},questions:{en:["What do you think forgiveness is NOT? Clear up common myths.","How does remembering God's forgiveness help you forgive others?","Is there someone you need to forgive today by decision, even if feelings have not changed yet?"],af:["Wat dink jy is vergifnis NIE? Maak algemene mites op.","Hoe help dit jou om ander te vergewe as jy God se vergifnis onthou?","Is daar iemand wat jy vandag deur ’n besluit moet vergewe, al het jou gevoelens nog nie verander nie?"]},action:{en:"Write the name of the person you need to forgive. Pray out loud: 'I choose to forgive [name] for [what they did]. I release them to You, God.' Do it daily this week.",af:"Skryf die naam neer van die persoon wat jy moet vergewe. Bid hardop: 'Ek kies om [naam] te vergewe vir [wat hulle gedoen het]. Ek gee hulle oor aan U, Here.' Doen dit daagliks hierdie week."},prayer:{en:"Father, thank You for forgiving me completely through Jesus. I now choose to forgive those who hurt me. Heal my heart as I obey.",af:"Vader, dankie dat U my volkome vergewe het deur Jesus. Ek kies nou om die wat my seergemaak het te vergewe. Genees my hart terwyl ek gehoorsaam is."}},{id:"week-4",number:4,title:{en:"Healing Together",af:"Saam Gesond Word"},subtitle:{en:"Making peace and setting boundaries",af:"Vrede maak en grense stel"},keyVerse:{refEn:"Matthew 5:23-24",refAf:"Mattheus 5:23-24",book:"MAT",cv:"5.23-24"},verses:[{refEn:"Romans 12:18",refAf:"Romeine 12:18",book:"ROM",cv:"12.18"},{refEn:"Matthew 18:15",refAf:"Mattheus 18:15",book:"MAT",cv:"18.15"}],intro:{en:"Forgiveness happens in your heart. Reconciliation happens between two people. Sometimes God calls you to go and make peace. This takes courage and wisdom.",af:"Vergifnis gebeur in jou hart. Versoening gebeur tussen twee mense. Soms roep God jou om te gaan en vrede te maak. Dit vra moed en wysheid."},points:{en:[{h:"Go to them",p:"Matthew 5 says if you know someone has something against you, go to them first. Do not wait for them to come to you."},{h:"Do your part",p:"Romans 12:18 says as far as it depends on you, live at peace with everyone. You cannot control their response, only your obedience."},{h:"Boundaries are healthy",p:"Forgiveness does not always mean things go back to exactly how they were. You can forgive and still set wise boundaries to protect your heart."}],af:[{h:"Gaan na hulle toe",p:"Mattheus 5 sê as jy weet iemand het iets teen jou, gaan eerste na hulle toe. Moenie wag dat hulle na jou toe kom nie."},{h:"Doen jou deel",p:"Romeine 12:18 sê leef, sover dit van julle afhang, in vrede met alle mense. Jy kan nie hulle reaksie beheer nie, net jou gehoorsaamheid."},{h:"Grense is gesond",p:"Vergifnis beteken nie altyd dinge gaan presies terug na hoe dit was nie. Jy kan vergewe en steeds wyse grense stel om jou hart te beskerm."}]},questions:{en:["Is there a conversation you have been avoiding that you need to have?","What would a healthy boundary look like in your situation?","How can you speak truth with love, not with anger?"],af:["Is daar ’n gesprek wat jy vermy wat jy eintlik moet hê?","Hoe sal ’n gesonde grens in jou situasie lyk?","Hoe kan jy die waarheid met liefde praat, nie met kwaad nie?"]},action:{en:"If God prompts you, send a short, calm message to make peace. Use: 'I value our relationship. Can we talk?' Do not blame, just open the door.",af:"As God jou lei, stuur ’n kort, rustige boodskap om vrede te maak. Gebruik: 'Ek waardeer ons verhouding. Kan ons praat?' Moenie blameer nie, maak net die deur oop."},prayer:{en:"Jesus, You are our peace. Give me courage to do my part. Help me speak with love and set boundaries with wisdom.",af:"Jesus, U is ons vrede. Gee my moed om my deel te doen. Help my om met liefde te praat en grense met wysheid te stel."}},{id:"week-5",number:5,title:{en:"Staying Free",af:"Bly Vry"},subtitle:{en:"Paul and Barnabas - moving forward after disagreement",af:"Paulus en Barnabas - vorentoe na ’n meningsverskil"},keyVerse:{refEn:"Acts 15:39-40",refAf:"Handelinge 15:39-40",book:"ACT",cv:"15.39-40"},verses:[{refEn:"2 Timothy 4:11",refAf:"2 Timoteus 4:11",book:"2TI",cv:"4.11"},{refEn:"Philippians 1:6",refAf:"Filippense 1:6",book:"PHP",cv:"1.6"}],intro:{en:"Even great leaders disagreed. Paul and Barnabas had a sharp disagreement about John Mark and separated. But God kept working through both of them. Later, Paul asked for Mark because he was helpful again.",af:"Selfs groot leiers het verskil. Paulus en Barnabas het skerp verskil oor Johannes Markus en uitmekaar gegaan. Maar God het steeds deur albei gewerk. Later het Paulus vir Markus gevra omdat hy weer nuttig was."},story:{en:"Acts 15:36-40 tells us Paul wanted to visit the churches again. Barnabas wanted to take Mark. Paul did not think Mark was ready because he had left them before. Their disagreement was so strong they split into two teams. Barnabas took Mark to Cyprus. Paul took Silas. God used both teams to spread the gospel to more places. Years later in 2 Timothy 4:11, Paul says, 'Get Mark and bring him with you, because he is helpful to me.' Healing happened. Ministry continued. God did not waste the pain - He multiplied the mission.",af:"Handelinge 15:36-40 vertel vir ons Paulus wou die gemeentes weer besoek. Barnabas wou Markus saamneem. Paulus het nie gedink Markus is reg nie omdat hy hulle vroeër verlaat het. Hulle meningsverskil was so sterk dat hulle in twee spanne verdeel het. Barnabas het Markus na Ciprus geneem. Paulus het Silas geneem. God het albei spanne gebruik om die evangelie na meer plekke te versprei. Jare later in 2 Timoteus 4:11 sê Paulus: 'Haal vir Markus en bring hom saam, want hy is vir my nuttig.' Genesing het gebeur. Bediening het voortgegaan. God het nie die pyn vermors nie - Hy het die sending vermenigvuldig."},points:{en:[{h:"Disagreement is not the end",p:"Paul and Barnabas did not stay stuck in offense. They kept serving God, just on different paths for a season."},{h:"Time and grace bring healing",p:"Mark grew. Paul changed his view. What looked like failure became a second chance. God restores people."},{h:"Your mission is bigger than the offense",p:"God used the split to double the mission teams. When you stay free from offense, God can use even painful splits for good."}],af:[{h:"Meningsverskil is nie die einde nie",p:"Paulus en Barnabas het nie in aanstoot vasgesit nie. Hulle het God bly dien, net vir ’n tyd op verskillende paaie."},{h:"Tyd en genade bring genesing",p:"Markus het gegroei. Paulus het sy siening verander. Wat soos mislukking gelyk het, het ’n tweede kans geword. God herstel mense."},{h:"Jou sending is groter as die aanstoot",p:"God het die verdeling gebruik om die sendingspanne te verdubbel. Wanneer jy vry bly van aanstoot, kan God selfs pynlike skeidings ten goede gebruik."}]},questions:{en:["What can we learn from Paul and Barnabas about handling strong disagreements?","How does 2 Timothy 4:11 show that relationships can heal over time?","What mission has God given you that is bigger than your offense?"],af:["Wat kan ons by Paulus en Barnabas leer oor hoe om sterk meningsverskille te hanteer?","Hoe wys 2 Timoteus 4:11 dat verhoudings met tyd kan genees?","Watter sending het God vir jou gegee wat groter is as jou aanstoot?"]},action:{en:"Pray for the person you disagreed with. Ask God to bless their mission. Then take one step forward in your own calling this week - serve, encourage, or start again.",af:"Bid vir die persoon met wie jy verskil het. Vra God om hulle sending te seën. Neem dan een stap vorentoe in jou eie roeping hierdie week - dien, bemoedig, of begin weer."},prayer:{en:"Father, thank You that You do not waste pain. Like Paul, Barnabas, and Mark, lead us forward. Keep me free from offense so I can finish my race.",af:"Vader, dankie dat U nie pyn vermors nie. Soos Paulus, Barnabas en Markus, lei ons vorentoe. Hou my vry van aanstoot sodat ek my wedloop kan voltooi."}}],de={headerTitle:{en:"Free From Offense",af:"Vry van Aanstoos"},headerSub:{en:"Grade 10 Study Guide • 5 Weeks",af:"Graad 10 Studiegids • 5 Weke"},gradeNote:{en:"Written in simple Grade 10 language for everyone to understand.",af:"Geskryf in eenvoudige Graad 10 taal sodat almal kan verstaan."},weeks:{en:"Weeks",af:"Weke"},keyVerse:{en:"Key Verse",af:"Sleutelvers"},readIn:{en:"Read in:",af:"Lees in:"},extraVerses:{en:"More to read",af:"Meer om te lees"},mainPoints:{en:"What this means",af:"Wat dit beteken"},deepDive:{en:"Paul & Barnabas Story",af:"Paulus & Barnabas Storie"},reflect:{en:"Think & Talk",af:"Dink & Praat"},action:{en:"Do this week",af:"Doen hierdie week"},prayer:{en:"Prayer",af:"Gebed"},langEn:"English",langAf:"Afrikaans",footer:{en:"Use #week-1 to #week-5 links to jump directly. Back button works.",af:"Gebruik #week-1 tot #week-5 skakels om direk te spring. Terug-knoppie werk."}};function hi(){let[e,t]=kr.useState("en"),[n,r]=kr.useState("week-1");kr.useEffect(()=>{let o=Ve.map((p)=>p.id),i=()=>window.location.hash.replace("#","").trim(),a=i();if(a&&o.includes(a))r(a);else if(window.location.hash!=="#week-1")window.history.replaceState(null,"","#week-1");let f=()=>{let p=i();if(p&&o.includes(p))r(p)};return window.addEventListener("hashchange",f),()=>window.removeEventListener("hashchange",f)},[]);let l=(o)=>{if(o===n)return;if(r(o),window.location.hash.slice(1)!==o)window.location.hash=o;window.scrollTo({top:0,behavior:"smooth"})},u=Ve.find((o)=>o.id===n)||Ve[0];return x("div",{className:"min-h-screen bg-[#fcfbf8] text-zinc-800 antialiased selection:bg-amber-200",children:[C("header",{className:"sticky top-0 z-30 backdrop-blur-xl bg-[#fcfbf8]/90 border-b border-zinc-200",children:x("div",{className:"mx-auto max-w-6xl px-4 md:px-8 py-4 flex items-center justify-between gap-4",children:[x("div",{className:"flex items-center gap-3",children:[C("div",{className:"h-9 w-9 rounded-xl bg-zinc-900 text-white grid place-items-cen
