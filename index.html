<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strome van Lewe · Bybelhulpbronne</title>
<meta name="description" content="Bybelhulpbronne van Strome van Lewe Gemeente — leesplanne en studies vir jou eie tyd en vir die kleingroep.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf7ef; --ink:#2b2117; --ink-2:#5a4a38; --ink-3:#8a7760; --ink-4:#a89885;
  --line:#efe2c8; --card:#fff; --sand:#fbf2e3; --gold:#d9b88c; --gold-d:#b0895a;
  --warm:#fef1d6; --warm-line:#f0d9b0; --deep:#2b2117; --shadow:0 8px 30px rgba(43,33,23,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
@media(min-width:768px){.wrap{padding:0 32px}}

header.top{position:sticky;top:0;z-index:40;background:rgba(253,247,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brandmini{display:flex;align-items:center;gap:10px;min-width:0}
.brandmini img{width:30px;height:30px;object-fit:contain;border-radius:6px}
.brandmini b{font:600 14px/1 Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillbox{display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;flex:0 0 auto}
.pillbox button{border:0;background:transparent;color:var(--ink-3);font:600 12px/1 Inter,sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer}
.pillbox button[aria-pressed="true"]{background:var(--deep);color:#fff}

.hero{padding-block:44px 8px;text-align:center}
.hero .mark{width:76px;height:76px;object-fit:contain;margin:0 auto 18px;display:block}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--gold-d);margin-bottom:14px}
.eyebrow i{display:block;width:26px;height:1px;background:var(--gold);font-style:normal}
.hero h1{font-size:clamp(32px,7vw,54px);line-height:1.02}
.hero .sub{margin:12px auto 0;max-width:52ch;font-size:clamp(15.5px,2.2vw,18px);line-height:1.6;color:var(--ink-2)}

.band{margin:26px 0 0;border-radius:22px;overflow:hidden;background:transparent}
/* works for any shape the artwork comes in — wide banner, square or upright */
.band img{display:block;width:auto;max-width:100%;height:auto;max-height:min(58vh,470px);object-fit:contain;margin:0 auto;border-radius:10px;box-shadow:0 14px 40px rgba(43,33,23,.13)}

.band .cap{padding:18px 18px 2px;font-size:12.5px;color:var(--ink-3);text-align:center;font-style:italic}

.sect{padding-block:44px 0}
.sect .head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.sect h2{font-size:clamp(21px,3.4vw,27px)}
.sect .count{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4)}
.grid{display:grid;gap:16px}
@media(min-width:820px){.grid{grid-template-columns:1fr 1fr}}

a.res{display:flex;flex-direction:column;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;transition:.18s}
a.res:hover{border-color:var(--deep);transform:translateY(-2px)}
a.res .body{padding:20px 22px;flex:1;display:flex;flex-direction:column}
.badge{align-self:flex-start;font:700 10px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:6px 10px;margin-bottom:14px}
.badge.now{background:var(--deep);color:#fff}
.badge.new{background:var(--warm);color:#8a5a2a;border:1px solid var(--warm-line)}
a.res h3{font-size:clamp(19px,2.6vw,23px);line-height:1.15}
a.res .meta{margin-top:8px;font-size:13px;color:var(--gold-d);font-weight:600;letter-spacing:.02em}
a.res p{margin:12px 0 0;font-size:14.5px;line-height:1.65;color:var(--ink-2)}
a.res .facts{margin-top:16px;display:flex;flex-wrap:wrap;gap:7px}
a.res .facts span{font:500 11.5px/1 Inter,sans-serif;color:var(--ink-3);background:var(--sand);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
a.res .go{margin-top:18px;display:inline-flex;align-items:center;gap:8px;font:600 13.5px/1 Inter,sans-serif;color:var(--ink)}
a.res:hover .go{color:#000}
a.res .go i{font-style:normal;transition:.18s}
a.res:hover .go i{transform:translateX(3px)}

.soon{border:1px dashed var(--warm-line);background:var(--sand);border-radius:20px;padding:20px 22px}
.soon h3{font-size:17px;color:var(--ink-2)}
.soon p{margin:8px 0 0;font-size:14px;line-height:1.6;color:var(--ink-3)}
.soon ul{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:7px}
.soon li{font:500 11.5px/1 Inter,sans-serif;color:var(--ink-3);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 10px}

.how{margin-top:52px;background:var(--deep);color:#f5e9d6;border-radius:22px;padding:26px 22px}
@media(min-width:768px){.how{padding:32px 34px}}
.how h2{color:#fff;font-size:clamp(20px,3vw,25px)}
.how .steps{margin-top:20px;display:grid;gap:20px}
@media(min-width:768px){.how .steps{grid-template-columns:repeat(3,1fr);gap:26px}}
.how .step b{display:flex;align-items:center;gap:10px;font:600 15px/1.3 Inter,sans-serif;color:#fff;margin-bottom:8px}
.how .step b i{font-style:normal;flex:0 0 auto;width:24px;height:24px;border-radius:999px;background:rgba(217,184,140,.18);color:var(--gold);display:grid;place-items:center;font:700 11px/1 Inter,sans-serif}
.how .step p{margin:0;font-size:14px;line-height:1.65;color:#e2d3ba}

footer.foot{margin-top:56px;border-top:1px solid var(--line);background:rgba(255,255,255,.6)}
.footin{padding-block:24px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink-4)}
.footin a{color:var(--ink-3)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap topin">
    <div class="brandmini">
      <img src="./assets/logo.png" alt="" onerror="this.remove()">
      <b>Strome van Lewe</b>
    </div>
    <div class="pillbox">
      <button id="bAF" aria-pressed="true">AF</button>
      <button id="bEN" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<div class="wrap hero">
  <img class="mark" src="./assets/logo.png" alt="Strome van Lewe" onerror="this.remove()">
  <div class="eyebrow"><i></i><span data-t="eyebrow"></span><i></i></div>
  <h1 data-t="title"></h1>
  <p class="sub" data-t="sub"></p>
</div>

<div class="wrap">
  <div class="band">
    <img src="./assets/hero.jpg" alt="" onerror="this.closest('.band').remove()">
    <div class="cap" data-t="verse"></div>
  </div>
</div>

<div class="wrap sect">
  <div class="head"><h2 data-t="h_plans"></h2><span class="count" data-t="c_plans"></span></div>
  <div class="grid" id="plans"></div>
</div>

<div class="wrap sect">
  <div class="head"><h2 data-t="h_studies"></h2><span class="count" data-t="c_studies"></span></div>
  <div class="grid" id="studies"></div>
</div>

<div class="wrap">
  <div class="how">
    <h2 data-t="h_how"></h2>
    <div class="steps" id="steps"></div>
  </div>
</div>

<footer class="foot">
  <div class="wrap footin">
    <span data-t="foot"></span>
    <a href="https://stromevanlewe.github.io/church-studies/">stromevanlewe.github.io/church-studies</a>
  </div>
</footer>

<script>
const T={
 af:{eyebrow:"Bybelhulpbronne",title:"Strome van Lewe",
   sub:"Hulpbronne vir jou eie tyd deur die week, en vir wanneer die groep bymekaarkom. Geen aanmelding nodig nie — deel net die skakel.",
   verse:"“Uit sy binneste sal strome lewende water vloei.” — Johannes 7:38",
   h_plans:"Leesplanne",c_plans:"1 beskikbaar",
   h_studies:"Studies",c_studies:"1 beskikbaar",
   h_how:"Hoe om dit te gebruik",
   foot:"Strome van Lewe Gemeente · Boshof",
   soonT:"Nog op pad",soonP:"Hierdie afdelings kom by sodra daar iets is om te deel.",
   steps:[["Kies 'n hulpbron","Klik op 'n kaart hierbo. Elkeen staan op sy eie — jy kan enige tyd begin."],
          ["Werk dit self deur","Die leesplan loop oor 90 dae. Die studie het agt sessies met 'n storie, vrae en 'n gebed."],
          ["Bring dit na die groep","Elke sessie het aparte groepvrae vir wanneer julle bymekaarkom."]],
   plans:[{badge:"Huidig",cls:"now",t:"3 Maande Bybel Leesplan",meta:"1 Sept – 30 Nov 2026",
     p:"Negentig dae deur die Skrif, met 'n merklys sodat jy kan sien waar jy is.",
     f:["90 dae","Volg jou vordering","Dagboek-vriendelik"],go:"Open leesplan",h:"./BiblePlans/3-month-plan/"}],
   studies:[{badge:"Nuut",cls:"new",t:"Om Aanstoot te Neem",meta:"Agt sessies · Tweetalig",
     p:"Wat aanstoot werklik is, hoekom dit vasvang, en die pad daaruit — insluitend die aanstoot van die Kruis wat ons nie mag wegvat nie.",
     f:["8 sessies","Storie per sessie","Vrae vir jou én vir die groep","Selftoets"],go:"Open studie",h:"./studies/offence/"}],
   soonList:["Boodskappe","Vir die huis","Hulpbronne vir leiers"]},
 en:{eyebrow:"Bible resources",title:"Strome van Lewe",
   sub:"Resources for your own time during the week, and for when the group meets. No sign-in needed — just share the link.",
   verse:"“Out of his heart will flow rivers of living water.” — John 7:38",
   h_plans:"Reading plans",c_plans:"1 available",
   h_studies:"Studies",c_studies:"1 available",
   h_how:"How to use it",
   foot:"Strome van Lewe Church · Boshof",
   soonT:"Still to come",soonP:"These sections appear as soon as there is something to share.",
   steps:[["Choose a resource","Click a card above. Each one stands on its own — start any time."],
          ["Work through it yourself","The plan runs over 90 days. The study has eight sessions with a story, questions and a prayer."],
          ["Bring it to the group","Every session has separate group questions for when you meet."]],
   plans:[{badge:"Current",cls:"now",t:"3-Month Bible Plan",meta:"1 Sept – 30 Nov 2026",
     p:"Ninety days through Scripture, with a checklist so you can see where you are.",
     f:["90 days","Track your progress","Journal-friendly"],go:"Open the plan",h:"./BiblePlans/3-month-plan/"}],
   studies:[{badge:"New",cls:"new",t:"The Trap of Offence",meta:"Eight sessions · Bilingual",
     p:"What offence really is, why it traps us, and the way out — including the offence of the Cross, which we must not remove.",
     f:["8 sessions","A story each session","Questions for you and for the group","Self-check"],go:"Open the study",h:"./studies/offence/"}],
   soonList:["Messages","For the home","Leader resources"]}
};
let lang="af";
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const card=c=>'<a class="res" href="'+c.h+'"><div class="body">'+
  '<span class="badge '+c.cls+'">'+esc(c.badge)+"</span><h3>"+esc(c.t)+'</h3><div class="meta">'+esc(c.meta)+"</div>"+
  "<p>"+esc(c.p)+'</p><div class="facts">'+c.f.map(x=>"<span>"+esc(x)+"</span>").join("")+"</div>"+
  '<div class="go">'+esc(c.go)+" <i>→</i></div></div></a>";
function soon(t){ return '<div class="soon"><h3>'+esc(t.soonT)+"</h3><p>"+esc(t.soonP)+"</p><ul>"+
  t.soonList.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul></div>"; }
function render(){
  const t=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t[el.dataset.t]);
  document.getElementById("plans").innerHTML=t.plans.map(card).join("");
  document.getElementById("studies").innerHTML=t.studies.map(card).join("")+soon(t);
  document.getElementById("steps").innerHTML=t.steps.map((s,i)=>
    '<div class="step"><b><i>'+(i+1)+"</i>"+esc(s[0])+"</b><p>"+esc(s[1])+"</p></div>").join("");
  document.getElementById("bAF").setAttribute("aria-pressed",lang==="af");
  document.getElementById("bEN").setAttribute("aria-pressed",lang==="en");
  document.querySelectorAll("#studies a.res, #plans a.res").forEach(a=>{
    if(lang==="en") a.href = a.getAttribute("href").split("?")[0]+"?lang=en";
  });
}
document.getElementById("bAF").onclick=()=>{lang="af";render()};
document.getElementById("bEN").onclick=()=>{lang="en";render()};
try{ if((new URLSearchParams(location.search).get("lang")||"")==="en") lang="en"; }catch(e){}
render();
</script>
</body>
</html>
